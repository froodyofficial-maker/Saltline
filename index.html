/* ============================================================
   NETWORK — PeerJS signalling + WebRTC data channel.
   The host gets a short 6-character room code. The connection itself
   persists for the whole lobby, so matches can be replayed without
   exchanging another code.
   ============================================================ */
let netMode = "local";                 // "local" | "host" | "guest"
let pc = null, ch = null, peer = null, netNote = "";
let localSeq  = { f:0, p:0, h:0, d:0, s:0, c:0 };
let remoteSeq = { f:0, p:0, h:0, d:0, s:0, c:0 };
let remotePkt = { a:[0,0], f:0, p:0, h:0, d:0, s:0, c:0 };
let lastUiKey = "";
let lobbyCode = "";
let netConnectTimer = 0;

const PEER_OPTIONS = {
  debug:1,
  config:{iceServers:[
    {urls:["stun:stun.l.google.com:19302"]},
    {urls:["stun:global.stun.twilio.com:3478"]}
  ]}
};

function makeLobbyCode(){
  const chars="ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
  let out="";
  for(let i=0;i<6;i++) out += chars[Math.floor(Math.random()*chars.length)];
  return out;
}
// The lobby code IS the PeerJS id. PeerJS allows alphanumeric IDs, so the
// friend can enter exactly what the host sees — no hidden prefix to mismatch.
function peerIdFromCode(code){ return String(code||"").trim().toUpperCase().replace(/[^A-Z0-9]/g,""); }
function peerAvailable(){ return typeof Peer === "function"; }
function clearNetTimer(){ if(netConnectTimer){clearTimeout(netConnectTimer);netConnectTimer=0;} }
function closePeerOnly(){
  clearNetTimer();
  try{ if(ch) ch.close(); }catch{}
  try{ if(pc) pc.close(); }catch{}
  try{ if(peer && !peer.destroyed) peer.destroy(); }catch{}
  ch=null; pc=null; peer=null;
}
function describeNetError(err){
  const t=err?.type || err?.message || "unknown error";
  const map={
    "peer-unavailable":"that lobby does not exist or has expired",
    "network":"could not reach the PeerJS lobby server",
    "server-error":"the lobby server rejected the connection",
    "socket-error":"the lobby server connection failed",
    "ssl-unavailable":"secure online connection is unavailable in this browser",
    "unavailable-id":"that lobby code is already in use",
    "invalid-id":"invalid lobby code",
    "webrtc":"WebRTC could not establish the peer connection"
  };
  return map[t] || t;
}
function markOnlineStatus(text){ setStat(text); }

function wireChannel(){
  if(!ch) return;
  clearNetTimer();
  const opened = () => {
    clearNetTimer();
    netNote = "";
    markOnlineStatus(netMode === "host" ? "LOBBY CONNECTED — choose the rules" : "CONNECTED — waiting for the host");
    if (netMode === "host") modeCard(startSelect);
    else show(`<div class="kicker">Connected</div><h2>You're in</h2>
               <p>Waiting for the host to choose the rules. You will stay connected between matches.</p>`, true);
  };
  const closed = () => {
    clearNetTimer();
    if (netMode !== "local") { netNote = "the other keeper disconnected"; toMenu(); }
  };
  const failed = err => {
    clearNetTimer();
    if (state === ST.NET) markOnlineStatus("connection error — " + describeNetError(err));
  };
  const received = data => {
    let msg=data;
    try{
      if(typeof msg === "string") msg=JSON.parse(msg);
      else if(msg instanceof ArrayBuffer) msg=JSON.parse(new TextDecoder().decode(msg));
    }catch{return;}
    if(!msg || typeof msg !== "object") return;
    if (netMode === "host" && msg.i) remotePkt = msg.i;
    else if (netMode === "guest" && msg.lobby){
      GAME_MODE = msg.lobby.mode || GAME_MODE; applyModifierSnapshot(msg.lobby.mods);
      if(state !== ST.SELECT) startSelect();
    }
    else if (netMode === "guest" && msg.s) guestApply(msg.s, msg.u);
  };
  if(typeof ch.on === "function"){
    ch.on("open", opened);
    ch.on("close", closed);
    ch.on("error", failed);
    ch.on("data", received);
    if(ch.open) setTimeout(opened,0);
  }else{
    ch.binaryType="arraybuffer";
    ch.onopen=opened; ch.onclose=closed; ch.onerror=failed; ch.onmessage=e=>received(e.data);
  }
}

function netCardShell(title, body, status){
  show(`<div class="kicker">Online duel</div><h2>${title}</h2>${body}
        <p class="hint" id="netstat">${status||""}</p>
        <button class="backBtn" id="netback">‹ BACK  (Esc)</button>`, true);
  const b=document.getElementById("netback"); if(b) b.onclick=toMenu;
}
const TA = `style="width:100%;height:90px;background:#0b131c;color:#cfe0f2;border:1px solid #24374b;
  border-radius:6px;padding:10px;font:600 20px/1.2 ui-monospace,monospace;resize:none;text-transform:uppercase;letter-spacing:.18em"`;
const BTNS = `style="margin:10px 8px 0 0;background:#132131;color:#e8eef7;border:1px solid #2b3a4d;
  border-radius:6px;padding:9px 16px;font:600 12px/1 ui-monospace,monospace;letter-spacing:.12em;cursor:pointer"`;
function setStat(t){ const el=document.getElementById("netstat"); if(el) el.textContent=t; }

function createPeer(id){
  // Explicitly point at PeerJS Cloud so the same broker is used by host and joiner.
  return id ? new Peer(id, PEER_OPTIONS) : new Peer(PEER_OPTIONS);
}

function startNetTimeout(message){
  clearNetTimer();
  netConnectTimer=setTimeout(()=>{
    if(ch && ch.open) return;
    markOnlineStatus(message);
    try{ if(ch) ch.close(); }catch{}
    ch=null;
  },20000);
}

function hostFlow(){
  if(!peerAvailable()) return netCardShell("Online unavailable", `<p>The online library did not load. Reload the page and try again.</p>`, "PeerJS could not be loaded");
  closePeerOnly();
  netMode="host"; state=ST.NET; lobbyCode=makeLobbyCode();
  netCardShell("Hosting", `<p>Give your friend this <b>6-character lobby code</b>:</p>
    <textarea ${TA} id="mine" readonly>${lobbyCode}</textarea>
    <button ${BTNS} id="copy">COPY CODE</button>
    <p style="margin-top:18px">Keep this page open. Your friend enters the code once, then both of you stay in the same lobby for rematches.</p>`, "connecting to lobby server…");
  const copy=document.getElementById("copy");
  if(copy) copy.onclick=()=>{
    const t=document.getElementById("mine");
    t.select();
    if(navigator.clipboard?.writeText) navigator.clipboard.writeText(t.value).then(()=>setStat("CODE COPIED"),()=>setStat("SELECT THE CODE AND COPY IT"));
    else setStat("SELECT THE CODE AND COPY IT");
  };
  try{
    peer=createPeer(peerIdFromCode(lobbyCode));
    peer.on("open",()=>markOnlineStatus("LOBBY READY — waiting for your friend"));
    peer.on("connection",conn=>{
      if(ch && ch.open){ try{conn.close();}catch{} return; }
      ch=conn;
      wireChannel();
      markOnlineStatus("FRIEND CONNECTING…");
    });
    peer.on("disconnected",()=>{ if(netMode==="host" && !peer.destroyed) { try{peer.reconnect();}catch{} } });
    peer.on("error",err=>{
      if(err?.type === "unavailable-id"){
        // Extremely rare, but never leave the user stuck with a dead code.
        try{peer.destroy();}catch{}
        setTimeout(hostFlow,150);
        return;
      }
      markOnlineStatus("LOBBY ERROR — " + describeNetError(err));
    });
  }catch(e){ markOnlineStatus("COULD NOT CREATE LOBBY — " + (e?.message||"try again")); }
}

function joinFlow(){
  if(!peerAvailable()) return netCardShell("Online unavailable", `<p>The online library did not load. Reload the page and try again.</p>`, "PeerJS could not be loaded");
  closePeerOnly();
  netMode="guest"; state=ST.NET;
  netCardShell("Join lobby", `<p>Enter the host's <b>6-character lobby code</b>:</p>
    <input ${TA.replace('height:90px','height:56px')} id="code" maxlength="6" placeholder="ABC123" autocomplete="off" spellcheck="false">
    <button ${BTNS} id="go">JOIN LOBBY</button>`, "");
  const input=document.getElementById("code"), go=document.getElementById("go");
  input.focus();
  input.oninput=()=>{ input.value=input.value.toUpperCase().replace(/[^A-Z0-9]/g,"").slice(0,6); };
  go.onclick=()=>{
    const code=peerIdFromCode(input.value);
    if(code.length!==6) return setStat("ENTER THE FULL 6-CHARACTER CODE");
    setStat("CONNECTING TO LOBBY…");
    try{
      peer=createPeer();
      peer.on("open",()=>{
        try{
          ch=peer.connect(code,{label:"saltline-duel",reliable:true,serialization:"json"});
          wireChannel();
          startNetTimeout("COULD NOT REACH THAT LOBBY — CHECK THE CODE AND MAKE SURE THE HOST IS STILL OPEN");
        }catch(e){ markOnlineStatus("COULD NOT CONNECT — " + (e?.message||"try again")); }
      });
      peer.on("disconnected",()=>{ if(netMode==="guest" && !peer.destroyed) { try{peer.reconnect();}catch{} } });
      peer.on("error",err=>markOnlineStatus("COULD NOT JOIN — " + describeNetError(err)));
    }catch(e){ markOnlineStatus("COULD NOT JOIN LOBBY — " + (e?.message||"try again")); }
  };
}

function netTeardown(){
  closePeerOnly(); netMode="local";
  localSeq={f:0,p:0,h:0,d:0,s:0,c:0}; remoteSeq={f:0,p:0,h:0,d:0,s:0,c:0};
  remotePkt={a:[0,0],f:0,p:0,h:0,d:0,s:0,c:0}; lobbyCode="";
}
function send(o){ if(ch && ch.open){ try{ch.send(o);return true;}catch{} } return false; }

function remoteInput(){
  const i=blankInput(); i.ax=remotePkt.a[0]; i.ay=remotePkt.a[1];
  if (netMode === "host" && game.players[1]) game.players[1].skinId = remotePkt.skin || "default";
  for(const k of ["f","p","h","d","s","c"]){
    if(remotePkt[k]>remoteSeq[k]){
      remoteSeq[k]++;
      if(k==="f") i.fire=true; else if(k==="p"){i.parry=true;i.back=true;} else if(k==="h") i.shield=true;
      else if(k==="d") i.dash=true; else if(k==="s") i.special=true; else i.confirm=true;
    }
  }
  return i;
}
function guestSend(){
  const s=currentSchemes()[0], ax=(hasHeld(s.left)?-1:0)+(hasHeld(s.right)?1:0), ay=(hasHeld(s.up)?-1:0)+(hasHeld(s.down)?1:0);
  if(hasEdge(s.fire))localSeq.f++; if(hasEdge(s.parry))localSeq.p++; if(hasEdge(s.shield))localSeq.h++; if(hasEdge(s.dash))localSeq.d++; if(hasEdge(s.special))localSeq.s++;
  if(hasEdge(s.fire)||edge.has("Enter"))localSeq.c++;
  send({i:{a:[ax,ay],f:localSeq.f,p:localSeq.p,h:localSeq.h,d:localSeq.d,s:localSeq.s,c:localSeq.c,skin:equippedSkin(1, game?.players?.[1]?.char?.id || CHARS[1].id)}});
}
function guestApply(s,u){
  const wasAlive=game.players.map(p=>p.alive), nMotes=game.motes.length, last=game.motes[nMotes-1], lastPos=last?{x:last.x,y:last.y}:null;
  game.applySnapshot(s);
  if(game.motes.length<nMotes&&lastPos)game.burst(lastPos.x,lastPos.y,"#cfe6ff",8);
  for(let i=0;i<2;i++)if(wasAlive[i]&&!game.players[i].alive)game.burst(game.players[i].x,game.players[i].y,game.players[i].char.color,46,260);
  if(u.mode)GAME_MODE=u.mode; if(u.mods)applyModifierSnapshot(u.mods);
  if(u.sel){SELECT_STATE.cursor=u.sel.c;SELECT_STATE.locked=u.sel.l;}
  const key=JSON.stringify(u);
  if(key!==lastUiKey){lastUiKey=key;state=u.st;
    if(u.st===ST.CARD)beatCard(u.i,u.r,seatNames()); else if(u.st===ST.EPI)epilogueCard(u.w,game.scores,seatNames());
    else if(u.st===ST.PLAY||u.st===ST.SELECT)hide(); else if(u.st===ST.MENU)menuCard();
  }
}

/* ============================================================
   THE CPU
   It plays through exactly the struct a human keyboard fills:
   eight directions, one fire, one shield, one guard, one dash, one special.
   Three rules keep it honest —
     · it reads only what is drawn on the screen,
     · it aims in the same eight directions a keyboard can make,
     · it is deterministic, so the same position is answered the
       same way twice and can be learned instead of out-rolled.
   ============================================================ */
const CPU_LEVELS = [
  { id:"APPRENTICE", think:0.30, bounces:0, parryOdds:0.20, dashOdds:0.30,
    specialOdds:0.35, lead:0.0,  hesitate:0.40, keepAt:270, blindFire:0.34 },
  { id:"SCOUT",      think:0.23, bounces:0, parryOdds:0.38, dashOdds:0.48,
    specialOdds:0.55, lead:0.25, hesitate:0.29, keepAt:278, blindFire:0.20 },
  { id:"KEEPER",     think:0.17, bounces:1, parryOdds:0.60, dashOdds:0.70,
    specialOdds:0.80, lead:0.55, hesitate:0.18, keepAt:285, blindFire:0.07 },
  { id:"WARDEN",     think:0.105,bounces:2, parryOdds:0.93, dashOdds:0.95,
    specialOdds:1.00, lead:1.0,  hesitate:0.0,  keepAt:260, blindFire:0.0 },
  { id:"HARBINGER",  think:0.065,bounces:3, parryOdds:0.985,dashOdds:0.99,
    specialOdds:1.00, lead:1.25, hesitate:-0.03,keepAt:245, blindFire:0.0 },
];

const CPU = { seats:[false,false], level:1, mem:[null,null], selT:0 };

const DIRS8 = (() => {
  const out = [];
  for (let i=0;i<8;i++){ const a = i*Math.PI/4; out.push([Math.cos(a), Math.sin(a)]); }
  return out;
})();

// Deterministic stand-in for a coin flip: the same situation always answers alike.
function hash01(x, y){
  let h = (Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// Decorrelates the two seats without favouring either: the draw comes from
// this keeper's own position and the mote in front of it, never from which
// seat it happens to be sitting in.
function cpuDraw(p, a, b){
  return hash01(Math.round(p.x)*13 + (a|0), Math.round(p.y)*7 + (b|0) + CPU.level*101);
}

function cpuMem(){
  return { t:0, round:-1, dir:[0,0], fire:false, dash:false, special:false, shield:false, parryTarget:0 };
}

function cpuBlocked(g, x, y, r){
  const b = g.bounds();
  if (x < b.x+r || x > b.x+b.w-r || y < b.y+r || y > b.y+b.h-r) return true;
  for (const w of g.obstacles){ if (resolveCircleRect({x,y}, w, r)) return true; }
  return false;
}

function cpuClearLine(g, from, to){
  const dx = to.x-from.x, dy = to.y-from.y, d = len(dx,dy) || 1;
  const stepX = dx/d*12, stepY = dy/d*12;
  let x = from.x, y = from.y;
  for (let i=0;i<d/12;i++){
    x += stepX; y += stepY;
    for (const w of g.obstacles){
      if (x > w.x && x < w.x+w.w && y > w.y && y < w.y+w.h) return false;
    }
  }
  return true;
}

/* Which motes would hit me if I stood perfectly still, and when. */
function cpuThreats(g, p){
  const list = [], step = 1/40, horizon = 1.1;
  for (const mo of g.motes){
    if (!mo.armed && mo.owner === p.idx) continue;       // inert in my own hands
    let x = mo.x, y = mo.y, vx = mo.vx, vy = mo.vy, t = 0;
    const r = mo.radius;
    while (t < horizon){
      x += vx*step; y += vy*step; t += step;
      const b = g.bounds();
      if (x < b.x+r){ x=b.x+r; vx=-vx; } else if (x > b.x+b.w-r){ x=b.x+b.w-r; vx=-vx; }
      if (y < b.y+r){ y=b.y+r; vy=-vy; } else if (y > b.y+b.h-r){ y=b.y+b.h-r; vy=-vy; }
      let eaten = false;
      for (const w of g.obstacles){
        const probe = {x,y}, axis = resolveCircleRect(probe, w, r);
        if (!axis) continue;
        x = probe.x; y = probe.y;
        if (w.void){ eaten = true; break; }
        if (axis === "x") vx = -vx; else vy = -vy;
      }
      if (eaten) break;
      if (len(x-p.x, y-p.y) <= p.st.radius + r + 8){ list.push({ id:mo.id, mote:mo, t, x, y }); break; }
    }
  }
  list.sort((a,b) => a.t - b.t);
  return list;
}

/* Is there a direction that puts a mote into them? Bank shots allowed
   by level. A line that comes back and kills me does not count. */
function cpuFindShot(g, p, foe, lvl){
  const st = p.st, step = 1/40, horizon = 1.5;
  let best = null;
  for (const [dx,dy] of DIRS8){
    const off = st.radius + st.moteRadius + 2, r = st.moteRadius;
    let x = p.x + dx*off, y = p.y + dy*off;
    let vx = dx*st.moteSpeed, vy = dy*st.moteSpeed;
    let t = 0, bounces = 0, hit = null, selfRisk = false;
    while (t < horizon){
      x += vx*step; y += vy*step; t += step;
      const b = g.bounds();
      let wall = false;
      if (x < b.x+r){ x=b.x+r; vx=-vx; wall=true; }
      else if (x > b.x+b.w-r){ x=b.x+b.w-r; vx=-vx; wall=true; }
      if (y < b.y+r){ y=b.y+r; vy=-vy; wall=true; }
      else if (y > b.y+b.h-r){ y=b.y+b.h-r; vy=-vy; wall=true; }
      let eaten = false;
      for (const w of g.obstacles){
        const probe = {x,y}, axis = resolveCircleRect(probe, w, r);
        if (!axis) continue;
        x = probe.x; y = probe.y;
        if (w.void){ eaten = true; break; }
        if (axis === "x") vx = -vx; else vy = -vy;
        wall = true;
      }
      if (eaten) break;
      if (wall && ++bounces > lvl.bounces) break;
      const lt = Math.min(t, 0.5) * lvl.lead;              // lead the target
      const fx = foe.x + foe.vx*lt, fy = foe.y + foe.vy*lt;
      if (len(x-fx, y-fy) <= foe.st.radius + r + 2){ hit = {t, bounces}; break; }
      if (bounces >= 1 && len(x-p.x, y-p.y) <= st.radius + r + 8){ selfRisk = true; break; }
    }
    if (hit && !selfRisk){
      const score = hit.t + hit.bounces*0.3 - (dx*p.fx + dy*p.fy)*0.004;
      if (!best || score < best.score) best = { dir:[dx,dy], score };
    }
  }
  return best;
}

/* Face the incoming mote, but angled as far toward the sender as the
   guard arc allows — a parry returns along your facing. */
function cpuParryFace(p, foe, threat){
  const toMote = Math.atan2(threat.mote.y - p.y, threat.mote.x - p.x);
  const toFoe  = Math.atan2(foe.y - p.y, foe.x - p.x);
  const limit  = p.st.parryArc/2 - 0.10;
  let best = null;
  for (const [dx,dy] of DIRS8){
    const a  = Math.atan2(dy,dx);
    const dm = Math.abs(Math.atan2(Math.sin(a-toMote), Math.cos(a-toMote)));
    if (dm > limit) continue;
    const df = Math.abs(Math.atan2(Math.sin(a-toFoe), Math.cos(a-toFoe)))
             - (dx*p.fx + dy*p.fy)*0.001;
    if (!best || df < best.df) best = { dir:[dx,dy], df };
  }
  if (best) return best.dir;
  const a = Math.round(toMote / (Math.PI/4)) & 7;
  return DIRS8[a];
}

function cpuEscape(g, p, threats){
  let best = null;
  for (const [dx,dy] of DIRS8){
    const px = p.x + dx*p.st.maxSpeed*0.32, py = p.y + dy*p.st.maxSpeed*0.32;
    if (cpuBlocked(g, px, py, p.st.radius)) continue;
    let score = 1e9;
    for (const t of threats) score = Math.min(score, len(px-t.x, py-t.y));
    score += (dx*p.fx + dy*p.fy) * 0.5;
    for (const mo of g.motes){
      if (!mo.armed && mo.owner === p.idx) continue;
      score = Math.min(score, len(px-mo.x, py-mo.y) + 40);
    }
    const b = g.bounds();
    score += Math.min(px-b.x, b.x+b.w-px, py-b.y, b.y+b.h-py) * 0.3;
    if (!best || score > best.score) best = { dir:[dx,dy], score };
  }
  return best ? best.dir : [0,0];
}

function cpuRoam(g, p, foe, threats, lvl){
  const b = g.bounds();
  const circle = Math.atan2(foe.y-p.y, foe.x-p.x)
               + (Math.floor(g.time/1.7) % 2 ? 1 : -1) * Math.PI/2;
  let best = null;
  for (const [dx,dy] of DIRS8){
    const px = p.x + dx*p.st.maxSpeed*0.35, py = p.y + dy*p.st.maxSpeed*0.35;
    if (cpuBlocked(g, px, py, p.st.radius)) continue;
    let score = -Math.abs(len(foe.x-px, foe.y-py) - lvl.keepAt) * 0.02;
    for (const t of threats) score -= Math.max(0, 170 - len(px-t.x, py-t.y)) * 0.04;
    for (const mo of g.motes){
      if (!mo.armed && mo.owner === p.idx) continue;
      score -= Math.max(0, 95 - len(px-mo.x, py-mo.y)) * 0.06;
    }
    score += Math.min(px-b.x, b.x+b.w-px, py-b.y, b.y+b.h-py) * 0.03;
    score += (dx*Math.cos(circle) + dy*Math.sin(circle)) * 1.1;
    score += (dx*p.fx + dy*p.fy) * 0.04;
    if (!best || score > best.score) best = { dir:[dx,dy], score };
  }
  return best ? best.dir : [0,0];
}

/* One rule per keeper — each special is spent where it actually pays. */
function cpuSpecialWanted(g, p, foe, lvl, worst, shot){
  if (!p.ready) return false;
  if (cpuDraw(p, Math.round(g.time*4)*31, 5) > lvl.specialOdds) return false;
  const dFoe = len(foe.x-p.x, foe.y-p.y);
  switch (p.char.id){
    case "ines":  return !!shot || (p.ammo === 0 && dFoe < 430);
    case "cato":  return !!worst && worst.t < 0.30 && p.dashCd > 0;
    case "meran": return !!shot && !p.primed && p.ammo > 0;
    case "odall": return !worst && dFoe < 500 && cpuClearLine(g, foe, p);
    case "silt":  return !!worst && worst.t < 0.22 && p.parryCd > 0;
    case "vane":  return g.motes.some(mo => mo.owner === p.idx && mo.armed &&
                         len(mo.x-foe.x, mo.y-foe.y) < 280 &&
                         (mo.x-foe.x)*mo.vx + (mo.y-foe.y)*mo.vy > 0);
    case "keel":  return !!worst && worst.t < 0.5;
    case "auger": return !!worst && worst.t > 0.25 && worst.t < 0.9;
  }
  return false;
}

function cpuFace(p, target){
  const a = Math.atan2(target.y - p.y, target.x - p.x);
  return DIRS8[(Math.round(a / (Math.PI/4)) & 7)];
}

/* The deliberate part: runs on the level's reaction clock, not every frame. */
function cpuPlan(g, seat, lvl, m){
  const p = g.players[seat], foe = g.players[1-seat];
  m.parryTarget = 0;
  if (!p.alive || !foe.alive || g.result){ m.dir = [0,0]; return; }

  const threats = cpuThreats(g, p);
  const worst = threats[0];
  const shot = (p.ammo > 0) ? cpuFindShot(g, p, foe, lvl) : null;
  const wantSpecial = cpuSpecialWanted(g, p, foe, lvl, worst, shot);

  // Specials that need to be aimed somewhere specific go first.
  if (wantSpecial && (p.char.id === "odall" || p.char.id === "auger")){
    m.special = true;
    m.dir = cpuFace(p, p.char.id === "odall" ? foe : (worst || foe));
    return;
  }
  if (wantSpecial && (p.char.id === "cato" || p.char.id === "silt" || p.char.id === "keel" ||
                      p.char.id === "vane" || p.char.id === "meran")){
    m.special = true;
    if (p.char.id === "meran" && shot) m.dir = shot.dir;
    else m.dir = worst ? cpuEscape(g, p, threats) : m.dir;
    if (p.char.id !== "meran") return;
  }

  // If the shot is too close for a parry, use the short emergency shield.
  if (worst && worst.t < 0.38 && p.shieldCd <= 0 && p.ghost <= 0 &&
      cpuDraw(p, worst.id*19, 29) < Math.min(0.98, lvl.parryOdds + 0.18)){
    m.shield = true;
    return;
  }

  // Commit to a parry — the press itself is timed frame by frame below.
  if (worst && worst.t < 0.55 && p.parryCd <= 0 && p.ghost <= 0 &&
      cpuDraw(p, worst.id*17, 11) < lvl.parryOdds){
    m.parryTarget = worst.id;
    m.dir = cpuParryFace(p, foe, worst);
    return;
  }

  // Otherwise get out of the way.
  if (worst && worst.t < 0.42){
    m.dir = cpuEscape(g, p, threats);
    if (p.dashCd <= 0 && worst.t < 0.26 && cpuDraw(p, worst.id*29, 23) < lvl.dashOdds) m.dash = true;
    return;
  }

  // Or take the shot, if there is one and the hands are steady.
  if (shot){
    const jitter = cpuDraw(p, Math.round(g.time*30)*3, 37);
    if (jitter >= lvl.hesitate){
      m.dir = shot.dir;
      if (p.char.id === "ines" && wantSpecial) m.special = true; else m.fire = true;
      return;
    }
  }
  if (p.ammo > 0 && lvl.blindFire > 0 &&
      cpuDraw(p, Math.round(g.time*7)*41, 53) < lvl.blindFire){
    m.dir = cpuFace(p, foe);
    m.fire = true;
    return;
  }
  m.dir = cpuRoam(g, p, foe, threats, lvl);
}

/* Called every frame: holds the plan, and times the guard press itself. */
function cpuInput(g, seat, dt){
  if(!CPU.mem) CPU.mem=[null,null];
  let m=CPU.mem[seat];
  if(!m || m.round!==g.round){m=CPU.mem[seat]=cpuMem();m.round=g.round;}
  const level=clamp(CPU.level|0,0,CPU_LEVELS.length-1);
  const lvl=CPU_LEVELS[level];
  m.t-=dt;
  const i=blankInput(),p=g.players[seat],foe=g.players[1-seat];
  if(!p || !foe || !p.alive || !foe.alive) return i;

  // Guaranteed baseline brain: continuously move toward a valid line to the
  // opponent and periodically fire. Difficulty changes reaction speed and
  // defensive actions, but never disables the CPU completely.
  if(m.t<=0){
    m.t=Math.max(.055,lvl.think);
    const dx=foe.x-p.x,dy=foe.y-p.y,d=len(dx,dy)||1;
    m.dir=[dx/d,dy/d];

    if(p.ammo>0 && d<820) m.fire=true;
    if(p.ready && d<560 && level>=1) m.special=true;
    if(p.dashCd<=0 && d>250 && d<620 && level>=2) m.dash=true;

    let near=null,nearD=Infinity;
    for(const mo of g.motes){
      if(mo.dead||mo.owner===p.idx) continue;
      const md=len(mo.x-p.x,mo.y-p.y);
      if(md<nearD){nearD=md;near=mo;}
    }
    if(near && nearD<100){
      const ax=p.x-near.x,ay=p.y-near.y,l=len(ax,ay)||1;
      m.dir=[ax/l,ay/l];
      if(p.shieldCd<=0 && level>=1) m.shield=true;
    }
  }

  i.ax=m.dir?.[0]||0;i.ay=m.dir?.[1]||0;
  i.fire=!!m.fire;i.dash=!!m.dash;i.special=!!m.special;i.shield=!!m.shield;
  m.fire=m.dash=m.special=m.shield=false;
  return i;
}

/* The CPU answers your pick on the select screen, then locks its own. */
const CPU_COUNTER = { ines:"keel", cato:"auger", meran:"odall", odall:"silt",
                      silt:"vane", vane:"meran", keel:"cato", auger:"ines" };

function cpuSelectInput(seat){
  const i=blankInput();
  const human=1-seat;
  if(!SELECT_STATE.locked[human]) return i;
  // CPU selection is deterministic and immediate once P1 commits. This avoids
  // the old animated CPU cursor getting stuck on the select screen.
  const visible=CHARS.map((c,idx)=>idx).filter(idx=>isUnlocked(CHARS[idx]));
  const humanId=CHARS[SELECT_STATE.cursor[human]]?.id;
  const targetId=CPU_COUNTER[humanId] || (visible[0] !== undefined ? CHARS[visible[0]].id : null);
  const target=Math.max(0,visible.find(idx=>CHARS[idx].id===targetId) ?? visible[0] ?? 0);
  SELECT_STATE.cursor[seat]=target;
  i.fire=true;
  return i;
}
/* Mouse/touch character selection.  Keyboard selection remains unchanged. */
cvs.addEventListener("pointerdown", e => {
  if (state !== ST.SELECT || netMode === "guest") return;
  const r = cvs.getBoundingClientRect();
  const x = (e.clientX - r.left) * W / r.width;
  const y = (e.clientY - r.top) * H / r.height;
  const visible = CHARS.map((c,i)=>i).filter(i=>isUnlocked(CHARS[i]));
  for (let pos=0; pos<visible.length; pos++){
    const idx = visible[pos], cr = cardRect(idx);
    if (x >= cr.x && x <= cr.x+cr.w && y >= cr.y && y <= cr.y+cr.h){
      // Mouse selection is a single action: click a fighter and lock P1.
      // In CPU mode the CPU then immediately chooses P2.
      const seat = 0;
      if (!SELECT_STATE.locked[seat]) {
        SELECT_STATE.cursor[seat] = idx;
        SELECT_STATE.locked[seat] = true;
        if (CPU.seats[1]) {
           const visible2 = CHARS.map((c,j)=>j).filter(j=>isUnlocked(CHARS[j]));
           const wanted = CPU_COUNTER[CHARS[SELECT_STATE.cursor[0]]?.id];
           SELECT_STATE.cursor[1] = visible2.find(j=>CHARS[j].id===wanted) ?? visible2[0] ?? 0;
           SELECT_STATE.locked[1] = true;
           beginMatch();
         }
      }
      break;
    }
  }
}, {passive:true});


/* ============================================================
   SOLO FREE-FOR-ALL
   ============================================================ */
const FFA_ARENA={id:"ffa_expanse",name:"The Expanse",width:1500,height:900,
 walls:[{x:330,y:180,w:170,h:30},{x:1000,y:690,w:170,h:30},{x:1000,y:180,w:170,h:30},{x:330,y:690,w:170,h:30},
 {x:670,y:390,w:160,h:120,void:true},{x:80,y:380,w:230,h:28},{x:1190,y:492,w:230,h:28},{x:650,y:80,w:200,h:26},{x:650,y:794,w:200,h:26}],
 spawns:[[120,120],[1380,120],[1380,780],[120,780],[750,130],[1370,450],[750,770],[130,450]],
 pickups:[[260,450],[470,330],[1030,330],[1240,450],[470,570],[1030,570],[750,250],[750,650]]};
let FFA_MODE="battle",FFA_CPU_COUNT=3,FFA_DIFFICULTY=2,FFA_PICKS=[],FFA_CPU_LEVELS=[],FFA_CPU_ACTIVE=[];
let FFA_SELECT_STATE={cursor:[0,0],locked:[false,false],lastAx:[0,0],lastAy:[0,0],msg:"",msgT:0};

class FfaGame extends Game{
 constructor(picks,mode,count){
  super([0,1]);this.ffa=true;this.ffaMode=mode;this.ffaCpuCount=count;this.scores=Array(count+1).fill(0);this.kills=Array(count+1).fill(0);
  this.players=Array.from({length:count+1},(_,i)=>new Player(i));
  this.players.forEach((p,i)=>{
   p.charId=picks[i] ?? 0;
   p.char=CHARS[p.charId] || CHARS[0];
   p.st=p.char.st;
  });
  this.loadRound(0);
 }
 get picks(){return this.players.map(p=>p.charId)}
 setPicks(p){this.players.forEach((x,i)=>{if(p[i]!=null)x.charId=p[i]})}
 loadRound(i){
  this.round=i;MOTE_SEQ=0;this.arena=FFA_ARENA;this.walls=this.arena.walls.map(w=>({...w}));this.temps=[];this.rings=[];this.motes=[];this.sparks=[];
  this.pickups=this.arena.pickups.map(a=>({x:a[0],y:a[1],cd:0}));this.time=0;this.encroach=0;this.closeTimer=0;this.overTimer=0;this.result=null;this.countdown=1.1;
  this.players.forEach((p,i)=>{
   p.char=CHARS[p.charId] || CHARS[0];
   p.st=p.char.st;
   const a=this.arena.spawns[i%this.arena.spawns.length];
   p.reset(a[0],a[1]);
   p.fx=p.x<this.arena.width/2?1:-1;p.fy=0;
  });
 }
 bounds(){const e=this.encroach;return{x:e,y:e,w:this.arena.width-2*e,h:this.arena.height-2*e}}
 confinePlayer(p){
  const r=p.st.radius,b=this.bounds();p.x=clamp(p.x,b.x+r,b.x+b.w-r);p.y=clamp(p.y,b.y+r,b.y+b.h-r);
  for(const w of this.obstacles){const a=resolveCircleRect(p,w,r);if(a==="x")p.vx=0;else if(a==="y")p.vy=0}
 }
 useSpecial(p){
  this.burst(p.x,p.y,p.char.color,30,230);
  switch(p.char.id){
   case"ines":this.spawnMote(p,-.3);this.spawnMote(p,0);this.spawnMote(p,.3);break;
   case"cato":if(p.hist.length>=2){p.x=p.hist[0];p.y=p.hist[1];p.vx=p.vy=0;p.hist.length=0;this.confinePlayer(p)}break;
   case"meran":p.primed=true;break;
   case"odall":{let h=Math.abs(p.fx)>=Math.abs(p.fy),w=h?16:96,hh=h?96:16;this.temps.push({x:clamp(p.x+p.fx*52-w/2,2,this.arena.width-w-2),y:clamp(p.y+p.fy*52-hh/2,2,this.arena.height-hh-2),w,h:hh,ttl:5,owner:p.idx});break}
   case"silt":p.ghost=.7;break;
   case"vane":this.motes.forEach(m=>{if(m.owner===p.idx&&!m.dead){m.vx=-m.vx;m.vy=-m.vy;m.armed=true}});break;
   case"keel":this.rings.push({id:++MOTE_SEQ,x:p.x,y:p.y,t:0,life:.42,owner:p.idx});break;
   case"auger":{let z=74;this.temps.push({x:clamp(p.x+p.fx*62-z/2,2,this.arena.width-z-2),y:clamp(p.y+p.fy*62-z/2,2,this.arena.height-z-2),w:z,h:z,ttl:6,void:true,owner:p.idx});break}
   case"bracken":this.motes.forEach(m=>{if(m.owner!==p.idx&&!m.dead){let dx=p.x-m.x,dy=p.y-m.y,d=len(dx,dy)||1;if(d<280){m.vx+=dx/d*300;m.vy+=dy/d*300}}});break;
   case "wisp": {
        if (netMode === "host" || netMode === "guest"){
          p.invisT = 3.0;
          p.burstT = 0.15;
        } else {
          // Local 2 Player: BLACKOUT — disrupt the other keeper's movement.
          const target = this.players.find(q => q.idx !== p.idx);
          if (target){
            target.jamT = Math.max(target.jamT || 0, 0.85);
            this.burst(target.x, target.y, p.char.color, 20, 170);
          }
        }
        break;
      }
  }
 }
 step(dt,inputs){
  if(this.shake>0)this.shake=Math.max(0,this.shake-dt*3.5);
  if(this.countdown>0){this.countdown=Math.max(0,this.countdown-dt);this.stepSparks(dt);return}
  if(this.result){this.overTimer+=dt;this.stepMotes(dt*.2);this.stepSparks(dt);return}
  this.time+=dt;
  for(let i=this.temps.length-1;i>=0;i--){this.temps[i].ttl-=dt;if(this.temps[i].ttl<=0)this.temps.splice(i,1)}
  for(let i=this.rings.length-1;i>=0;i--){this.rings[i].t+=dt;if(this.rings[i].t>=this.rings[i].life)this.rings.splice(i,1)}
  if(this.time>120){this.closeTimer+=dt;if(this.closeTimer>=1){this.closeTimer-=1;this.encroach=Math.min(400,this.encroach+10)}}
  for(let i=0;i<this.players.length;i++)this.stepPlayer(this.players[i],inputs[i],dt);
  this.stepMotes(dt);this.stepPickups(dt);this.checkFfaDeaths();this.stepSparks(dt);
  if(this.ffaMode==="kills"&&this.time>=120){let w=0;for(let i=1;i<this.kills.length;i++)if(this.kills[i]>this.kills[w])w=i;this.result={winner:w}}
 }
 checkFfaDeaths(){
  const dead=[],killer=new Map(),b=this.bounds();
  for(const p of this.players){if(!p.alive)continue;if(p.x<b.x||p.x>b.x+b.w||p.y<b.y||p.y>b.y+b.h){dead.push(p.idx);killer.set(p.idx,-1);continue}
   for(const m of this.motes){if(m.dead)continue;if(m.owner===p.idx&&((p.idx===0&&GAME_MODIFIERS.noSelfDeath)||(p.idx>0&&GAME_MODIFIERS.noCpuSelfDeath)))continue;
    const d=len(m.x-p.x,m.y-p.y);if(!m.armed&&m.owner===p.idx)continue;if(d<=p.st.radius+m.radius){if(p.ghost>0)continue;if(p.shieldT>0){m.dead=true;p.flash=.18;continue}dead.push(p.idx);killer.set(p.idx,m.owner);m.dead=true;break}
   }
  }
  if(!dead.length)return;
  for(const idx of dead){const p=this.players[idx],k=killer.get(idx);this.burst(p.x,p.y,p.char.color,42,250);sfxTone("explode");if(k>=0&&k!==idx)this.kills[k]++;
   if(this.ffaMode==="kills"){const a=this.arena.spawns[idx%this.arena.spawns.length];p.x=a[0];p.y=a[1];p.vx=p.vy=0;p.alive=true;p.shieldT=1.5;p.shieldCd=1.5;p.respawnLock=1.5;p.ammo=p.st.ammo}
   else p.alive=false;
  }
  this.motes=this.motes.filter(m=>!m.dead);
  if(this.ffaMode==="battle"){const a=this.players.filter(p=>p.alive);if(a.length<=1)this.result={winner:a[0]?.idx??-1}}
 }
}

function ffaInput(g,seat,dt){
  if(!CPU.mem) CPU.mem=[];
  const m=CPU.mem[seat]||(CPU.mem[seat]=cpuMem());
  const personalLevel=clamp(FFA_CPU_LEVELS[seat] ?? 2,0,CPU_LEVELS.length-1);
  const lvl=CPU_LEVELS[personalLevel];
  m.t-=dt;
  const i=blankInput(),p=g.players[seat];
  if(!p || !p.alive) return i;
  if(m.t<=0){
    m.t=Math.max(0.055,lvl.think);
    let target=null,best=Infinity;
    for(const q of g.players){
      if(q.idx===seat || !q.alive) continue;
      const d=len(q.x-p.x,q.y-p.y);
      if(d<best){best=d;target=q;}
    }
    if(target){
      const dx=target.x-p.x,dy=target.y-p.y,d=len(dx,dy)||1;
      m.dir=[dx/d,dy/d];
      if(p.ammo>0 && best<900) m.fire=true;
      if(p.ready && best<600) m.special=true;
      if(p.dashCd<=0 && best>260 && best<720 && personalLevel>=1) m.dash=true;
      let near=null,nearD=Infinity;
      for(const mo of g.motes){
        if(mo.dead||mo.owner===seat) continue;
        const md=len(mo.x-p.x,mo.y-p.y);
        if(md<nearD){nearD=md;near=mo;}
      }
      if(near && nearD<105){
        const ax=p.x-near.x,ay=p.y-near.y,l=len(ax,ay)||1;
        m.dir=[ax/l,ay/l];
        if(p.shieldCd<=0 && personalLevel>=1) m.shield=true;
      }
    } else m.dir=[1,0];
  }
  i.ax=m.dir?.[0]||0; i.ay=m.dir?.[1]||0;
  i.fire=!!m.fire; i.special=!!m.special; i.shield=!!m.shield; i.dash=!!m.dash;
  m.fire=m.special=m.shield=m.dash=false;
  return i;
}

      <div class="ffaCountRow" style="grid-template-columns:repeat(${Math.min(count,7)},1fr)">
        ${Array.from({length:count},(_,i)=>{
          const cc=CHARS.find(x=>x.id===picks[i])||avail[0];
          return `<button class="ffaCount ${i===activeSlot?"selected":""}" id="slot${i}">
            <b>SELECT CPU ${i+1}</b><br><span style="color:${cc.color}">${cc.name}</span><br><small>${active[i]?"ENABLED":"DISABLED"}</small>
          </button>`;
        }).join("")}
      </div>

      <div class="rule"></div>
      <div class="kicker">SELECTED: CPU ${activeSlot+1}</div>
      <button class="diffBtn" id="ftoggle"><b>${active[activeSlot]?"✓ ENABLED":"✕ DISABLED"}</b><span style="float:right;color:var(--muted)">${active[activeSlot]?"this CPU will fight":"this CPU will sit out"}</span></button>

      <div class="kicker" style="margin-top:14px">LEVEL</div>
      <div class="modeGrid" style="grid-template-columns:repeat(5,1fr)">
        ${CPU_LEVELS.map((x,i)=>`<button class="modeBtn ${levels[activeSlot]===i?"selected":""}" id="fsl${i}"><div class="num">${i+1}</div><div class="lbl">${x.id}</div></button>`).join("")}
      </div>

      <div class="kicker" style="margin-top:14px">FIGHTER</div>
      <div class="ffaRoster">
        ${avail.map(x=>`<button class="ffaFighter ${picks[activeSlot]===x.id?"selected":""}" style="--fc:${x.color}" id="ff${x.id}"><b style="color:${x.color}">${x.name}</b><small>${picks[activeSlot]===x.id?"SELECTED":"SELECT"}</small></button>`).join("")}
      </div>

      <p class="hint">Select CPU 1, set it up, then select CPU 2, CPU 3, and so on. Disable any CPU you don't want. ${activeCount} CPU${activeCount===1?"":"s"} enabled.</p>
      <button class="diffBtn" id="fgo">CONTINUE TO YOUR FIGHTER</button>
      <button class="backBtn" id="fback">‹ BACK</button>`,true);

    document.getElementById("fb").onclick=()=>{mode="battle";render()};
    document.getElementById("fk").onclick=()=>{mode="kills";render()};
    [1,2,3,4,5,6,7].forEach(n=>{
      document.getElementById("fc"+n).onclick=()=>{
        count=n;
        while(picks.length<count) picks.push(avail[picks.length%avail.length].id);
        while(levels.length<count) levels.push(2);
        while(active.length<count) active.push(true);
        picks=picks.slice(0,count); levels=levels.slice(0,count); active=active.slice(0,count);
        activeSlot=Math.min(activeSlot,count-1);
        render();
      };
    });
    for(let i=0;i<count;i++) document.getElementById("slot"+i).onclick=()=>{activeSlot=i;render()};
    document.getElementById("ftoggle").onclick=()=>{
      if(active[activeSlot] && activeCount<=1) return;
      active[activeSlot]=!active[activeSlot];
      render();
    };
    CPU_LEVELS.forEach((_,i)=>document.getElementById("fsl"+i).onclick=()=>{levels[activeSlot]=i;render()});
    avail.forEach(x=>document.getElementById("ff"+x.id).onclick=()=>{picks[activeSlot]=x.id;render()});
    document.getElementById("fgo").onclick=()=>{
      const activePicks=[],activeLevels=[];
      for(let i=0;i<count;i++) if(active[i]){activePicks.push(picks[i]);activeLevels.push(levels[i]);}
      if(!activePicks.length) return;
      FFA_MODE=mode; FFA_CPU_COUNT=activePicks.length; FFA_PICKS=activePicks.slice(); FFA_CPU_LEVELS=activeLevels.slice(); FFA_CPU_ACTIVE=activePicks.map(()=>true);
      startFfaSelect();
    };
    document.getElementById("fback").onclick=toMenu;
  };
  render();
}
function startFfaSelect(){
  const v=CHARS.map((c,i)=>i).filter(i=>isUnlocked(CHARS[i]));
  const c=v[0]??0;
  FFA_SELECT_STATE={cursor:[c,c],locked:[false,false],lastAx:[0,0],lastAy:[0,0],msg:"",msgT:0};
  SELECT_STATE=FFA_SELECT_STATE; state=ST.FFASELECT; hide();
  renderSelect(FFA_SELECT_STATE,{selHint:"SOLO FFA · choose your fighter · ENTER / SPACE to lock"});
}

function stepFfaSelect(inp){
  if(FFA_SELECT_STATE.locked[0]) return;
  const v=CHARS.map((c,i)=>i).filter(i=>isUnlocked(CHARS[i]));
  let p=Math.max(0,v.indexOf(FFA_SELECT_STATE.cursor[0]));
  const ax=Math.sign(inp.ax),ay=Math.sign(inp.ay);
  if(ax&&ax!==FFA_SELECT_STATE.lastAx[0])p=(p+ax+v.length)%v.length;
  if(ay&&ay!==FFA_SELECT_STATE.lastAy[0])p=clamp(p+ay*4,0,v.length-1);
  FFA_SELECT_STATE.cursor[0]=v[p]??0; FFA_SELECT_STATE.cursor[1]=FFA_SELECT_STATE.cursor[0];
  FFA_SELECT_STATE.lastAx[0]=ax; FFA_SELECT_STATE.lastAy[0]=ay;
  if(inp.fire){FFA_SELECT_STATE.locked[0]=true;beginFfa()}
}

function beginFfa(){
  const cpuIds=FFA_PICKS.slice(0,FFA_CPU_COUNT).map(id=>{const n=CHARS.findIndex(c=>c.id===id);return n>=0?n:0;});
  const picks=[FFA_SELECT_STATE.cursor[0],...cpuIds];
  CPU.seats=Array(picks.length).fill(false);
  CPU.mem=Array(picks.length).fill(null);
  game=new FfaGame(picks,FFA_MODE,cpuIds.length);
  state=ST.PLAY; hide(); acc=0;
}

}

/* ============================================================
   STATE MACHINE
   ============================================================ */
const ST = { MENU:0, NET:1, SELECT:2, CARD:3, PLAY:4, EPI:5, DIFF:6, FFASELECT:7 };
let state = ST.MENU;
let game = new Game();
let cardIdx = 0, resultLine = "", epiWinner = 0;

function seatNames(){ return game.players.map(p => p.char); }

function uiPacket(){
  return { st:state, mode:GAME_MODE, mods:modifierSnapshot(), i:cardIdx, r:resultLine, w:epiWinner,
           sel:{ c:SELECT_STATE.cursor, l:SELECT_STATE.locked } };
}

function toMenu(){
  state = ST.MENU; lastUiKey = "";
  CPU.seats = [false,false]; CPU.mem = [null,null];
  FFA_MODE="battle";FFA_CPU_COUNT=3;FFA_DIFFICULTY=2;FFA_PICKS=[];FFA_CPU_LEVELS=[];FFA_CPU_ACTIVE=[];
  game = new Game();
  netTeardown();
  menuCard();
  if (netNote){ const el = document.querySelector(".kicker"); if (el) el.textContent = netNote; netNote = ""; }
}

function startSelect(){
  // Start both cursors on characters that are actually available.
  const visible = CHARS.map((c,i)=>i).filter(i=>isUnlocked(CHARS[i]));
  const a = visible[0] ?? 0, b = visible[1] ?? a;
  SELECT_STATE = { cursor:[a,b], locked:[false,false], lastAx:[0,0], lastAy:[0,0], msg:"", msgT:0 };
  state = ST.SELECT;
  hide();
  // Render immediately as well as on the next animation tick. This makes the
  // transition reliable even if the browser throttles requestAnimationFrame.
  renderSelect(SELECT_STATE, { selHint: CPU.seats[1] ? "choose your fighter — the CPU will choose next" : "player one on W A S D, player two on the arrows" });
}

function stepSelect(inputs){
  for (let s=0;s<2;s++){
    const inp = inputs[s];
    if (SELECT_STATE.locked[s]){
      if (inp.back) SELECT_STATE.locked[s] = false;     // guard takes your pick back
      continue;
    }
    // move one card per press, not one per frame
    const ax = Math.sign(inp.ax), ay = Math.sign(inp.ay);
    const visible = CHARS.map((c,i)=>i).filter(i => isUnlocked(CHARS[i]));
    let pos = Math.max(0, visible.indexOf(SELECT_STATE.cursor[s]));
    if (ax !== 0 && ax !== SELECT_STATE.lastAx[s]){
      const col = pos % SEL_COLS, row = Math.floor(pos / SEL_COLS);
      pos = row*SEL_COLS + (col + ax + SEL_COLS) % SEL_COLS;
    }
    if (ay !== 0 && ay !== SELECT_STATE.lastAy[s]){
      const rows = Math.max(1, Math.ceil(visible.length / SEL_COLS));
      const col = pos % SEL_COLS, row = Math.floor(pos / SEL_COLS);
      pos = ((row + ay + rows) % rows)*SEL_COLS + col;
    }
    pos = clamp(pos, 0, visible.length-1);
    SELECT_STATE.cursor[s] = visible[pos] ?? 0;
    SELECT_STATE.lastAx[s] = ax; SELECT_STATE.lastAy[s] = ay;
    if (inp.fire){
      const c = CHARS[SELECT_STATE.cursor[s]];
      if (CPU.seats[s] || isUnlocked(c)) SELECT_STATE.locked[s] = true;
      else if (tryUnlock(c)) SELECT_STATE.locked[s] = true;
      else { SELECT_STATE.msg = "Need " + (UNLOCK_COST[c.id]-PROGRESS.coins) + " more salt-coins for " + c.name; SELECT_STATE.msgT = 2.2; }
    }
  }
  if (SELECT_STATE.msgT > 0) SELECT_STATE.msgT -= 1/60;

  // VS CPU: the moment P1 locks, the CPU gets its fighter and the match
  // starts. No second CPU cursor/animation is required.
  if (CPU.seats[1] && SELECT_STATE.locked[0] && !SELECT_STATE.locked[1]) {
    const visible = CHARS.map((c,idx)=>idx).filter(idx=>isUnlocked(CHARS[idx]));
    const wanted = CPU_COUNTER[CHARS[SELECT_STATE.cursor[0]]?.id];
    SELECT_STATE.cursor[1] = visible.find(idx=>CHARS[idx].id===wanted) ?? visible[0] ?? 0;
    SELECT_STATE.locked[1] = true;
  }
  if (SELECT_STATE.locked[0] && SELECT_STATE.locked[1]) beginMatch();
}

function beginMatch(){
  MATCH_NO++;
  game = new Game(SELECT_STATE.cursor.slice());
  cardIdx = 0; resultLine = "";
  if (CPU.seats[1]) { beginRound(); return; }
  state = ST.CARD;
  beatCard(0, "", seatNames());
}

function beginRound(){
  game.loadRound(cardIdx);
  state = ST.PLAY;
  hide();
}

function endOfRound(){
  const w = game.result.winner;
  if (w === -1){
    if(game.livesMode){
      // In 3-lives mode a simultaneous final hit is a draw. Give both keepers
      // one life back so the match can continue without silently resetting all lives.
      for(const p of game.players){ p.lives=Math.max(1,p.lives??1); p.alive=true; }
      resultLine = "Simultaneous — both keepers survive with one life";
      beginRound();
      return;
    }
    resultLine = "Simultaneous — the round is void";
    beginRound();
    return;
  }
  if (game.livesMode || game.scores[w] >= (GAME_MODE==="sudden" ? 1 : WINS_NEEDED)){
    epiWinner = w; state = ST.EPI;
    LAST_COINS_EARNED = 0;
    // Coins are earned only by a human beating the CPU — never for CPU vs CPU,
    // never for local or online duels between two people.
    if (CPU.seats[0] !== CPU.seats[1] && !CPU.seats[w]){
      LAST_COINS_EARNED = CPU_WIN_COINS[CPU.level];
      PROGRESS.coins += LAST_COINS_EARNED;
      saveProgress();
    }
    epilogueCard(w, game.scores, seatNames());
    return;
  }
  cardIdx++;
  resultLine = `${game.players[w].char.name} takes the round, ` +
               `${ROUND_FLAVOR[Math.min(cardIdx-1, ROUND_FLAVOR.length-1)]}` +
               ` — ${game.scores[0]}–${game.scores[1]}`;
  state = ST.CARD;
  beatCard(cardIdx, resultLine, seatNames());
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const FIXED = 1/120;
let acc = 0, last = performance.now();

let keepInputEdge = false;
function tick(now){
  requestAnimationFrame(tick);
  keepInputEdge = false;
  const dt = Math.min(0.1, (now - last)/1000); last = now;

  if (edge.has("Escape") && state !== ST.MENU){ netNote = ""; toMenu(); edge.clear(); mouseEdge.clear(); return; }

  if (netMode === "guest"){
    guestSend();
    game.stepSparks(dt);
    if (state === ST.PLAY) render(game, { netLabel:"ONLINE — you hold the right seat" });
    else if (state === ST.SELECT) renderSelect(SELECT_STATE, { selHint:"the host takes the left seat" });
    edge.clear(); mouseEdge.clear();
    return;
  }

  const seatInputs = () => {
    if (netMode === "host") return [readInput(0), remoteInput()];
    return [0,1].map(s => CPU.seats[s] ? cpuInput(game, s, dt) : readInput(s));
  };

  switch (state){
    case ST.MENU:
      if (edge.has("Digit1") || edge.has("Numpad1")){ netMode = "local"; CPU.seats = [false,false]; startSelect(); }
      else if (edge.has("Digit2") || edge.has("Numpad2")) hostFlow();
      else if (edge.has("Digit3") || edge.has("Numpad3")) joinFlow();
      else if (edge.has("Digit4") || edge.has("Numpad4")){ state = ST.DIFF; difficultyCard(); }
      else if (edge.has("Digit5") || edge.has("Numpad5")) modeCard();
      else if (edge.has("Digit6") || edge.has("Numpad6")) shopCard();
      else if (edge.has("Digit7") || edge.has("Numpad7")) settingsCard();
      else if (edge.has("Digit8") || edge.has("Numpad8")) skinsCard();
      break;

    case ST.DIFF: {
      const pick = ["Digit1","Digit2","Digit3","Digit4","Digit5"].findIndex(k => edge.has(k));
      if (pick >= 0){ netMode = "local"; CPU.level = pick; CPU.seats = [false,true]; startSelect(); }
      break;
    }

    case ST.NET:
      break;

    case ST.SELECT: {
      stepSelect([0,1].map(s =>
        CPU.seats[s] ? cpuSelectInput(s)
        : (netMode === "host" && s === 1) ? remoteInput() : readInput(s)));
      if (state === ST.SELECT)
        renderSelect(SELECT_STATE, { selHint: netMode === "host"
          ? "you hold the left seat — they choose for themselves"
          : CPU.seats[1] ? "take your mirror — the tower answers with its own"
          : "player one on W A S D, player two on the arrows" });
      break;
    }

    case ST.FFASELECT: {
      const inp=readInput(0); stepFfaSelect(inp);
      if(state===ST.FFASELECT) renderSelect(FFA_SELECT_STATE,{selHint:"SOLO FFA · choose your fighter · ENTER / SPACE to lock"});
      break;
    }

    case ST.CARD: {
      const go = netMode === "host" ? (anyConfirm() || remoteInput().confirm) : anyConfirm();
      if (go) beginRound();
      break;
    }

    case ST.PLAY: {
      if(game.ffa){
        const inputs=game.players.map((_,i)=>i===0?readInput(0):ffaInput(game,i,dt));
        acc+=dt;let first=true,stepped=false;
        while(acc>=FIXED){stepped=true;game.step(FIXED,inputs);acc-=FIXED;if(first){for(const i of inputs){i.fire=i.parry=i.shield=i.dash=i.special=false;}first=false;}}
        renderFFA(game);
        if(game.result&&game.overTimer>1.4){state=ST.FFASELECT;FFA_SELECT_STATE.locked[0]=false;SELECT_STATE=FFA_SELECT_STATE;hide();renderSelect(FFA_SELECT_STATE,{selHint:"SOLO FFA · choose your next fighter"});}
        if(!stepped)keepInputEdge=true;break;
      }
      const inputs = seatInputs();
      acc += dt;
      let first = true, stepped = false;
      while (acc >= FIXED){
        stepped = true;
        game.step(FIXED, inputs);
        acc -= FIXED;
        if (first){                       // a press fires once, not once per substep
          for (const i of inputs){ i.fire = i.parry = i.shield = i.dash = i.special = false; }
          first = false;
        }
      }
      render(game, { netLabel: netMode === "host" ? "ONLINE — you hold the left seat" : "" });
      if (game.result && game.overTimer > 1.8) endOfRound();
      // If this animation frame did not reach a fixed simulation step, keep
      // keyboard/mouse edge presses alive for the next frame. Otherwise a
      // fast frame could swallow the player's fire/parry/dash press while
      // the CPU's timed actions still appeared to work.
      if (!stepped) keepInputEdge = true;
      break;
    }

    case ST.EPI:
      if (netMode === "host" ? (anyConfirm() || remoteInput().confirm) : anyConfirm()) startSelect();
      break;
  }

  if (netMode === "host") send({ s:game.snapshot(), u:uiPacket() });
  if (!keepInputEdge) { edge.clear(); mouseEdge.clear(); }
}

menuCard();
requestAnimationFrame(tick);
</script>
