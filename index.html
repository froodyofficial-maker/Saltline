<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SALT LINE — a two-player duel</title>
<style>
  :root{
    --bg:#06090f;
    --ink:#dfe7f2;
    --dim:#7b8899;
    --edge:#1b2735;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    overflow:hidden;}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  canvas{display:block;image-rendering:auto;background:#06090f;
    box-shadow:0 0 0 1px #16202c, 0 24px 80px rgba(0,0,0,.8);}
  #overlay{position:absolute;inset:0;display:none;align-items:flex-start;justify-content:center;
    padding:4vh 6vw;box-sizing:border-box;background:radial-gradient(ellipse at 50% 40%, rgba(8,12,20,.86), rgba(4,6,10,.97));
    backdrop-filter:blur(2px);overflow:auto;}
  #overlay.on{display:flex;}
  .card{max-width:760px;width:100%;animation:rise .5s ease both;margin:0 auto;}
  @keyframes rise{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:none;}}
  .kicker{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.34em;text-transform:uppercase;color:var(--dim);margin-bottom:18px;}
  h1{font-size:clamp(44px,9vw,96px);line-height:.92;margin:0 0 10px;letter-spacing:.06em;font-weight:500;}
  h2{font-size:clamp(24px,4vw,38px);line-height:1.1;margin:0 0 18px;font-weight:500;letter-spacing:.02em;}
  p{font-size:clamp(15px,1.9vw,19px);line-height:1.62;margin:0 0 14px;color:#c3cedd;max-width:62ch;}
  p.speaker{font:600 12px/1 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.28em;
    text-transform:uppercase;color:var(--dim);margin-bottom:12px;}
  .hint{margin-top:28px;font:500 13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:.16em;color:var(--dim);text-transform:uppercase;}
  .hint b{color:var(--ink);font-weight:600;}
  .keys{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:26px 0 0;
    font:500 13px/1.9 ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.04em;}
  .keys section{border-top:1px solid var(--edge);padding-top:12px;}
  .keys h3{margin:0 0 8px;font:600 12px/1 ui-monospace,monospace;letter-spacing:.28em;text-transform:uppercase;}
  .keys dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;color:#a9b6c7;}
  .keys dt{color:#e8eef7;}
  kbd{display:inline-block;border:1px solid #2b3a4d;border-bottom-width:2px;border-radius:4px;
    padding:1px 6px;background:#0e1720;color:#e8eef7;font:600 12px/1.5 ui-monospace,monospace;}
  .rule{height:1px;background:linear-gradient(90deg,transparent,var(--edge),transparent);margin:26px 0;}
  .blink{animation:blink 1.6s ease-in-out infinite;}
  @keyframes blink{0%,100%{opacity:.45}50%{opacity:1}}
  @media (prefers-reduced-motion:reduce){.card,.blink{animation:none;}}

  .coinTag{display:inline-block;font:600 13px/1 ui-monospace,monospace;letter-spacing:.06em;
    color:#ffd66b;background:rgba(255,214,107,.1);border:1px solid rgba(255,214,107,.3);
    border-radius:20px;padding:6px 14px;margin-bottom:20px;}
  .modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:22px 0 6px;}
  @media (max-width:640px){.modeGrid{grid-template-columns:1fr;}}
  .modeBtn{display:block;text-align:left;width:100%;cursor:pointer;
    background:#101a26;border:1px solid #223245;border-radius:10px;padding:16px 18px;
    color:var(--ink);font-family:inherit;transition:border-color .15s,transform .15s,background .15s;}
  .modeBtn:hover{border-color:#4a6a8f;background:#132234;transform:translateY(-2px);}
  .modeBtn:active{transform:translateY(0);}
  .modeBtn .num{font:600 11px ui-monospace,monospace;letter-spacing:.2em;color:var(--dim);}
  .modeBtn .lbl{font-size:17px;margin:5px 0 3px;letter-spacing:.01em;}
  .modeBtn .desc{font:500 12px/1.4 ui-monospace,monospace;color:#8b98a9;letter-spacing:.01em;}
  .diffBtn{display:block;width:100%;text-align:left;cursor:pointer;
    background:#101a26;border:1px solid #223245;border-radius:8px;padding:12px 16px;margin-top:10px;
    color:var(--ink);font-family:inherit;transition:border-color .15s,background .15s;}
  .diffBtn:hover{border-color:#4a6a8f;background:#132234;}
  .diffBtn b{color:#e8eef7;}
  .backBtn{margin-top:20px;background:none;border:1px solid #223245;border-radius:6px;
    color:var(--dim);font:600 11px ui-monospace,monospace;letter-spacing:.14em;
    padding:8px 14px;cursor:pointer;}
  .backBtn:hover{color:var(--ink);border-color:#4a6a8f;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="600"></canvas>
  <div id="overlay"></div>
</div>
<script>
"use strict";
/* ============================================================
   SALT LINE — a two-player mirror duel, local or online.

   Design rule: nothing in the simulation is random. Every
   outcome comes from positioning, aim, timing, and reading
   your opponent. Math.random is used for spark particles only,
   and those touch nothing that decides a round.
   ============================================================ */

const W = 960, H = 600;
const cvs = document.getElementById("c");
const ctx = cvs.getContext("2d");
const overlay = document.getElementById("overlay");

/* The simulation always thinks in a 960x600 field; the canvas is scaled
   to whatever room the window has, at device pixel density. */
let viewScale = 1;
function fitCanvas(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const s = Math.min((innerWidth - 32) / W, (innerHeight - 32) / H);
  viewScale = Math.max(0.4, s);
  cvs.style.width  = (W * viewScale) + "px";
  cvs.style.height = (H * viewScale) + "px";
  cvs.width  = Math.round(W * viewScale * dpr);
  cvs.height = Math.round(H * viewScale * dpr);
  viewScale *= dpr;
}
addEventListener("resize", fitCanvas);
fitCanvas();

/* ---------- shared tuning ---------- */

   motes alive off the walls, and slipping past a live one. */

const PROGRESS_KEY = "saltline_progress_v1";
function loadProgress(){
  try {
    const raw = localStorage.getItem(PROGRESS_KEY);
    if (raw){
      const p = JSON.parse(raw);
      if (p && Array.isArray(p.unlocked) && typeof p.coins === "number") return p;
    }
  } catch {}
  return { coins:0, unlocked:["ines","cato"] };
}
function saveProgress(){
  try { localStorage.setItem(PROGRESS_KEY, JSON.stringify(PROGRESS)); } catch {}
}

 classic:{name:"Classic Duel",desc:"First to 3 round wins. The original SALT LINE rules."},

 <button class="backBtn" id="gmback">‹ BACK</button>`);

 show(`<div class="kicker">Settings</div><h2>Controls</h2><p>Click an action, then press the key you want. Changes save automatically.</p>
 <div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:20px">${["p1","p2"].map((who,si)=>`<section style="border-top:1px solid var(--edge);padding-top:12px"><h3 style="font:600 12px ui-monospace;letter-spacing:.2em">${si?"PLAYER TWO":"PLAYER ONE"}</h3>${rows.map(([k,l])=>`<button class="diffBtn bindBtn" data-seat="${who}" data-key="${k}">${l}<span style="float:right;color:#ffd66b">${keyLabel(KEYBINDS[who][k])}</span></button>`).join("")}</section>`).join("")}</div>

 <button class="backBtn" id="shopback">‹ BACK</button>`);
 CHARS.forEach(c=>document.getElementById("shop_"+c.id).onclick=()=>{if(!isUnlocked(c)&&tryUnlock(c))shopCard();});

}

function isUnlocked(c){ return UNLOCK_COST[c.id] === 0 || PROGRESS.unlocked.includes(c.id); }
function tryUnlock(c){
  if (isUnlocked(c)) return true;
  const cost = UNLOCK_COST[c.id];
  if (PROGRESS.coins < cost) return false;
  PROGRESS.coins -= cost;
  PROGRESS.unlocked.push(c.id);
  saveProgress();
  return true;
}

/* ============================================================
   INPUT
   ============================================================ */
const held = new Set(), edge = new Set();
const BLOCK = new Set(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight",
                       "Slash","Period","Comma","Semicolon","KeyQ","KeyE","KeyF"]);

const typing = e => {
  const t = e.target;
  return t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT");
};
addEventListener("keydown", e => {
  if (typing(e)){ if (e.code === "Escape") { held.add(e.code); edge.add(e.code); } return; }
  if (BLOCK.has(e.code)) e.preventDefault();
  if (e.repeat) return;
  held.add(e.code); edge.add(e.code);
}, {passive:false});
addEventListener("keyup", e => held.delete(e.code));
addEventListener("blur", () => { held.clear(); edge.clear(); });

const hasHeld = k => Array.isArray(k) ? k.some(x => held.has(x)) : held.has(k);
const hasEdge = k => Array.isArray(k) ? k.some(x => edge.has(x)) : edge.has(k);

const SCHEMES = [
  { up:"KeyW", down:"KeyS", left:"KeyA", right:"KeyD",
    fire:"Space", parry:"KeyQ", dash:"KeyE", special:["KeyF","KeyR"] },
  { up:"ArrowUp", down:"ArrowDown", left:"ArrowLeft", right:"ArrowRight",
    fire:"Period", parry:"Comma", dash:"Slash", special:["Semicolon","ShiftRight","Numpad0"] },
];

function blankInput(){
  return {ax:0, ay:0, fire:false, parry:false, dash:false, special:false, confirm:false, back:false};
}

function readInput(schemeIndex){
  const s = currentSchemes()[schemeIndex], i = blankInput();
  if (hasHeld(s.left))  i.ax -= 1;
  if (hasHeld(s.right)) i.ax += 1;
  if (hasHeld(s.up))    i.ay -= 1;
  if (hasHeld(s.down))  i.ay += 1;
  i.fire    = hasEdge(s.fire);
  i.parry   = hasEdge(s.parry);
  i.dash    = hasEdge(s.dash);
  i.special = hasEdge(s.special);
  i.confirm = i.fire || edge.has("Enter");
  i.back    = i.parry;
  return i;
}
// Either player may advance a story card in local play.
function anyConfirm(){
  return edge.has("Space") || edge.has("Enter") || edge.has("Period");
}

/* ============================================================
   GEOMETRY HELPERS
   ============================================================ */
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function len(x,y){ return Math.hypot(x,y); }

// Push a circle out of an axis-aligned rect. Returns the axis of the
// shallowest overlap ("x"/"y") or null when there is no contact.
function resolveCircleRect(c, r, rad){
  const nx = clamp(c.x, r.x, r.x + r.w), ny = clamp(c.y, r.y, r.y + r.h);
  const dx = c.x - nx, dy = c.y - ny, d2 = dx*dx + dy*dy;
  if (d2 > rad*rad) return null;

  if (d2 > 1e-6){                      // touching an edge or corner
    const d = Math.sqrt(d2), push = rad - d;
    c.x += (dx/d) * push; c.y += (dy/d) * push;
    return Math.abs(dx) > Math.abs(dy) ? "x" : "y";
  }
  // centre is inside the rect: eject along the shallowest face
  const l = c.x - r.x, rr = r.x + r.w - c.x, t = c.y - r.y, b = r.y + r.h - c.y;
  const m = Math.min(l, rr, t, b);
  if (m === l)  { c.x = r.x - rad;        return "x"; }
  if (m === rr) { c.x = r.x + r.w + rad;  return "x"; }
  if (m === t)  { c.y = r.y - rad;        return "y"; }
  c.y = r.y + r.h + rad;                  return "y";
}

/* ============================================================
   SIMULATION
   ============================================================ */
const EBB_FRAMES = 150;          // ~1.25s of position history at the fixed step

class Player {
  constructor(idx){ this.idx = idx; this.charId = DEFAULT_PICKS[idx]; this.reset(0,0); }

  reset(x,y){
    this.char = CHARS[this.charId];
    this.st = this.char.st;
    this.x=x; this.y=y; this.vx=0; this.vy=0;
    this.fx = x < W/2 ? 1 : -1; this.fy = 0;   // facing, unit vector
    this.alive = true;
    this.ammo = this.st.ammo; this.reloads = [];
    this.fireCd = 0; this.parryCd = 0; this.parryT = 0;
    this.dashCd = 0; this.dashT = 0;
    this.flash = 0; this.charge = 0; this.ghost = 0; this.burstT = 0;
    this.primed = false;                        // Meran's prism is loaded
    this.hist = [];
  }
  get facing(){ return Math.atan2(this.fy, this.fx); }
  get ready(){ return this.charge >= CHG_FULL; }
  addCharge(n){ this.charge = Math.min(CHG_FULL, this.charge + n); }
}

let MOTE_SEQ = 0;
class Mote {
  constructor(p, x, y, vx, vy){
    const st = p.st;
    this.id = ++MOTE_SEQ;
    this.owner = p.idx; this.x=x; this.y=y; this.vx=vx; this.vy=vy;
    this.radius = st.moteRadius; this.maxBounces = st.moteBounces;
    this.life = st.moteLife; this.armTime = st.armTime; this.gain = st.bounceGain;
    this.age=0; this.bounces=0; this.armed=false; this.dead=false;
    this.split=false; this.given=0; this.miss=[false,false]; this.rings=[];
    this.trail=[];
  }
}

class Game {
  constructor(picks){
    this.scores=[0,0];
    this.round=0;
    this.motes=[];
    this.players=[new Player(0), new Player(1)];
    this.setPicks(picks || DEFAULT_PICKS);
    this.sparks=[];
    this.shake=0;
    this.loadRound(0);
  }

  setPicks(picks){
    this.players[0].charId = picks[0];
    this.players[1].charId = picks[1];
  }
  get picks(){ return [this.players[0].charId, this.players[1].charId]; }

  loadRound(i){
    this.round = i;
    MOTE_SEQ = 0;          // ids restart each round: the CPU reads them, and its
                           // answer to a position must not depend on how many
                           // motes the page happened to spawn before this one

    this.arena = ARENAS[i % ARENAS.length];
    this.walls = this.arena.walls.map(w => ({...w}));
    this.temps = [];                 // walls conjured by specials
    this.rings = [];
    this.motes.length = 0;
    this.sparks.length = 0;
    this.pickups = (this.arena.pickups || []).map(pt => ({x:pt[0], y:pt[1], cd:0}));
    this.time = 0;
    this.encroach = 0;
    this.closeTimer = 0;
    this.overTimer = 0;
    this.result = null;              // {winner:0|1|-1}
    this.countdown = 1.1;            // a short freeze so neither seat gets a head start
    const sp = this.arena.spawns;
    this.players[0].reset(sp[0][0], sp[0][1]);
    this.players[1].reset(sp[1][0], sp[1][1]);
    this.players[0].fx = 1; this.players[1].fx = -1;
  }

  // Every solid thing a mote or a keeper can meet, arena and conjured alike.
  get obstacles(){ return this.walls.concat(this.temps); }

  bounds(){
    const e = this.encroach;
    return {x:e, y:e, w:W-2*e, h:H-2*e};
  }

  step(dt, inputs){
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt*3.5);

    // Neither seat can move, fire, or guard until this clears — so on a
    // shared keyboard the player who reacts to the card first doesn't
    // get a free head start on the player who is still finding their keys.
    if (this.countdown > 0){
      this.countdown = Math.max(0, this.countdown - dt);
      this.stepSparks(dt);
      return;
    }

    this.time += dt;
    const modeRoundTime = GAME_MODE==="tide" ? 18 : ROUND_TIME;

    for (let i = this.temps.length - 1; i >= 0; i--){
      this.temps[i].ttl -= dt;
      if (this.temps[i].ttl <= 0) this.temps.splice(i,1);
    }
    for (let i = this.rings.length - 1; i >= 0; i--){
      this.rings[i].t += dt;
      if (this.rings[i].t >= this.rings[i].life) this.rings.splice(i,1);
    }

    if (!this.result){
      // The dark closes in so a stalemate cannot simply be waited out.
      if (this.time > modeRoundTime){
        this.closeTimer += dt;
        if (this.closeTimer >= CLOSE_STEP){
          this.closeTimer -= CLOSE_STEP;
          // No ceiling: the dark keeps stepping in until it catches whoever
          // is worst placed. A round cannot be waited out.
          this.encroach += CLOSE_AMOUNT;
        }
      }
      for (let i=0;i<2;i++) this.stepPlayer(this.players[i], inputs[i], dt);
      this.stepMotes(dt);
      this.stepPickups(dt);
      this.checkDeaths();
    } else {
      this.overTimer += dt;
      this.stepMotes(dt * 0.25);   // slow motion on the kill
    }
    this.stepSparks(dt);
  }

  stepPlayer(p, inp, dt){
    if (!p.alive) return;
    const st = p.st;
    p.fireCd  = Math.max(0, p.fireCd  - dt);
    p.parryCd = Math.max(0, p.parryCd - dt);
    p.dashCd  = Math.max(0, p.dashCd  - dt);
    p.parryT  = Math.max(0, p.parryT  - dt);
    p.dashT   = Math.max(0, p.dashT   - dt);
    p.flash   = Math.max(0, p.flash   - dt);
    p.ghost   = Math.max(0, p.ghost   - dt);
    p.burstT  = Math.max(0, p.burstT  - dt);

    p.hist.push(p.x, p.y);
    if (p.hist.length > EBB_FRAMES*2) p.hist.splice(0, p.hist.length - EBB_FRAMES*2);

    for (let i = p.reloads.length - 1; i >= 0; i--){
      p.reloads[i] -= dt;
      if (p.reloads[i] <= 0){ p.reloads.splice(i,1); p.ammo = Math.min(st.ammo, p.ammo + 1); }
    }

    let ax = inp.ax, ay = inp.ay;
    const m = len(ax, ay);
    if (m > 0){
      ax /= m; ay /= m;
      p.fx = ax; p.fy = ay;                 // aim is welded to movement: no free-look
    }

    if (inp.special && p.ready){ p.charge = 0; p.burstT = 0.4; this.useSpecial(p); }

    if (inp.dash && p.dashCd <= 0){
      p.vx = p.fx * st.dashSpeed; p.vy = p.fy * st.dashSpeed;
      p.dashT = st.dashTime; p.dashCd = st.dashCd;
    }
    if (inp.parry && p.parryCd <= 0 && p.ghost <= 0){
      p.parryT = st.parryTime; p.parryCd = st.parryCd;
    }
    if (inp.fire && p.fireCd <= 0 && p.ammo > 0 && p.ghost <= 0){
      p.ammo--; p.fireCd = st.fireCd;
      const mo = this.spawnMote(p, 0);
      if (p.primed){ mo.split = true; p.primed = false; }
    }

    if (p.dashT <= 0){
      p.vx += ax * st.accel * dt; p.vy += ay * st.accel * dt;
      const damp = Math.exp(-st.friction * dt);
      p.vx *= damp; p.vy *= damp;
      const s = len(p.vx, p.vy);
      if (s > st.maxSpeed){ p.vx = p.vx/s*st.maxSpeed; p.vy = p.vy/s*st.maxSpeed; }
    }

    p.x += p.vx * dt; p.y += p.vy * dt;
    this.confinePlayer(p);
  }

  confinePlayer(p){
    const rad = p.st.radius, b = this.bounds();
    if (p.x < b.x + rad){ p.x = b.x + rad; p.vx = 0; }
    if (p.x > b.x + b.w - rad){ p.x = b.x + b.w - rad; p.vx = 0; }
    if (p.y < b.y + rad){ p.y = b.y + rad; p.vy = 0; }
    if (p.y > b.y + b.h - rad){ p.y = b.y + b.h - rad; p.vy = 0; }
    for (const w of this.obstacles){
      const axis = resolveCircleRect(p, w, rad);
      if (axis === "x") p.vx = 0; else if (axis === "y") p.vy = 0;
    }
  }

  // Ammo caches scattered around the arena. Touch one at less-than-full
  // ammo to take a mote from it; it goes dark for a while and refills.
  PICKUP_COOLDOWN = GAME_MODE==="frenzy" ? 2.5 : 5;
  stepPickups(dt){
    for (const pk of this.pickups){
      if (pk.cd > 0){ pk.cd = Math.max(0, pk.cd - dt); continue; }
      for (const p of this.players){
        if (!p.alive || p.ammo >= p.st.ammo) continue;
        const d = len(p.x - pk.x, p.y - pk.y);
        if (d <= p.st.radius + 14){
          p.ammo = Math.min(p.st.ammo, p.ammo + 1);
          pk.cd = this.PICKUP_COOLDOWN;
          this.burst(pk.x, pk.y, "#e9f2ff", 14);
          break;
        }
      }
    }
  }

  spawnMote(p, angleOffset){
    const a = p.facing + angleOffset;
    const dx = Math.cos(a), dy = Math.sin(a);
    const off = p.st.radius + p.st.moteRadius + 2;
    const mo = new Mote(p, p.x + dx*off, p.y + dy*off, dx*p.st.moteSpeed, dy*p.st.moteSpeed);
    this.motes.push(mo);
    return mo;
  }

  /* ---------- the specials ---------- */
  useSpecial(p){
    const st = p.st;
    this.burst(p.x, p.y, p.char.color, 26, 220);
    switch (p.char.id){

      case "ines":                       // SECOND WICK — three at once, free of ammo
        this.spawnMote(p, -0.30); this.spawnMote(p, 0); this.spawnMote(p, 0.30);
        break;

      case "cato": {                     // EBB — step back into your own past
        if (p.hist.length >= 2){
          p.x = p.hist[0]; p.y = p.hist[1];
          p.vx = 0; p.vy = 0; p.hist.length = 0;
          this.confinePlayer(p);
          this.burst(p.x, p.y, p.char.color, 24, 200);
        }
        break;
      }

      case "meran":                      // PRISM — load the next shot
        p.primed = true;
        break;

      case "odall": {                    // BREAKWATER — raise a wall of slag
        const horiz = Math.abs(p.fx) >= Math.abs(p.fy);
        const w = horiz ? 16 : 96, h = horiz ? 96 : 16;
        this.temps.push({ x: clamp(p.x + p.fx*52 - w/2, 2, W-w-2),
                          y: clamp(p.y + p.fy*52 - h/2, 2, H-h-2),
                          w, h, ttl:5, owner:p.idx });
        break;
      }

      case "silt":                       // DUCK UNDER — let the light pass through
        p.ghost = 0.7;
        break;

      case "vane":                       // RECALL — every mote of yours turns around
        for (const mo of this.motes){
          if (mo.owner !== p.idx || mo.dead) continue;
          mo.vx = -mo.vx; mo.vy = -mo.vy;
          mo.armed = true; mo.trail.length = 0;
          this.burst(mo.x, mo.y, p.char.color, 8);
        }
        break;

      case "keel":                       // RINGING — throw everything outward
        this.rings.push({ id:++MOTE_SEQ, x:p.x, y:p.y, t:0, life:0.42, owner:p.idx });
        this.shake = Math.max(this.shake, 0.5);
        break;

      case "auger": {                    // SINKHOLE — a hole that drinks light
        const s = 74;
        this.temps.push({ x: clamp(p.x + p.fx*62 - s/2, 2, W-s-2),
                          y: clamp(p.y + p.fy*62 - s/2, 2, H-s-2),
                          w:s, h:s, ttl:6, void:true, owner:p.idx });
        break;
      }
    }
  }

  stepMotes(dt){
    const STEPS = 4, h = dt / STEPS;
    for (const mo of this.motes){
      if (mo.dead) continue;
      mo.age += dt;
      if (!mo.armed && mo.age >= mo.armTime) mo.armed = true;
      if (mo.age >= mo.life) { this.fizzle(mo); continue; }

      mo.trail.push(mo.x, mo.y);
      if (mo.trail.length > 16) mo.trail.splice(0, mo.trail.length - 16);

      for (let s=0; s<STEPS && !mo.dead; s++){
        mo.x += mo.vx * h; mo.y += mo.vy * h;

        const b = this.bounds(), r = mo.radius;
        if (mo.x < b.x + r){ mo.x = b.x + r; mo.vx = -mo.vx; this.onBounce(mo); }
        else if (mo.x > b.x + b.w - r){ mo.x = b.x + b.w - r; mo.vx = -mo.vx; this.onBounce(mo); }
        if (mo.y < b.y + r){ mo.y = b.y + r; mo.vy = -mo.vy; this.onBounce(mo); }
        else if (mo.y > b.y + b.h - r){ mo.y = b.y + b.h - r; mo.vy = -mo.vy; this.onBounce(mo); }

        for (const w of this.obstacles){
          const axis = resolveCircleRect(mo, w, r);
          if (!axis) continue;
          if (w.void){ this.burst(mo.x, mo.y, "#5a6b80", 10); this.kill(mo); break; }
          if (axis === "x") mo.vx = -mo.vx; else mo.vy = -mo.vy;
          this.onBounce(mo);
        }
      }
      if (mo.dead) continue;

      // Keel's ring throws motes outward as it passes over them.
      for (const ring of this.rings){
        if (mo.rings.includes(ring.id)) continue;
        const rad = 210 * (ring.t / ring.life);
        const dx = mo.x - ring.x, dy = mo.y - ring.y, d = len(dx,dy) || 1;
        if (d > rad) continue;
        mo.rings.push(ring.id);
        const sp = Math.max(len(mo.vx, mo.vy), 620);
        mo.vx = dx/d * sp; mo.vy = dy/d * sp;
        mo.owner = ring.owner; mo.armed = true; mo.trail.length = 0;
        this.burst(mo.x, mo.y, CHARS[this.players[ring.owner].charId].color, 10);
      }

      // Parry: a live guard in front of a keeper catches the mote and
      // sends it back along whatever direction that keeper is facing.
      // If both keepers could catch the same mote on the same frame the
      // nearer mirror takes it; a dead heat goes to neither, so seat order
      // never decides a duel.
      let claim = null, tie = false;
      for (const p of this.players){
        if (!p.alive || p.parryT <= 0) continue;
        const dx = mo.x - p.x, dy = mo.y - p.y, d = len(dx,dy);
        if (d > p.st.parryReach + mo.radius) continue;
        let a = Math.atan2(dy,dx) - p.facing;
        a = Math.atan2(Math.sin(a), Math.cos(a));
        if (Math.abs(a) > p.st.parryArc/2) continue;
        if (!claim || d < claim.d - 1e-9){ claim = {p, d}; tie = false; }
        else if (Math.abs(d - claim.d) <= 1e-9) tie = true;
      }
      if (claim && !tie){
        const p = claim.p;
        mo.owner = p.idx; mo.armed = true; mo.bounces = 0;
        mo.miss = [false,false];
        mo.vx = p.fx * p.st.returnSpeed; mo.vy = p.fy * p.st.returnSpeed;
        mo.x = p.x + p.fx * (p.st.radius + mo.radius + 3);
        mo.y = p.y + p.fy * (p.st.radius + mo.radius + 3);
        mo.trail.length = 0;
        p.flash = 0.22; p.parryT = 0; p.addCharge(CHG_PARRY);
        this.shake = Math.max(this.shake, 0.35);
        this.burst(mo.x, mo.y, p.char.color, 16);
      }
    }
    this.motes = this.motes.filter(m => !m.dead);
  }

  onBounce(mo){
    mo.armed = true;                 // after one wall, it belongs to nobody
    mo.bounces++;
    mo.trail.length = 0;
    if (mo.gain !== 1){ mo.vx *= mo.gain; mo.vy *= mo.gain; }
    this.burst(mo.x, mo.y, "#cfe6ff", 4);

    if (mo.given < 3){ mo.given++; this.players[mo.owner].addCharge(CHG_BOUNCE); }

    if (mo.split && mo.bounces === 1){          // Meran's prism opens here
      mo.split = false;
      const sp = len(mo.vx, mo.vy), a = Math.atan2(mo.vy, mo.vx);
      for (const off of [-0.38, 0.38]){
        const clone = new Mote(this.players[mo.owner], mo.x, mo.y,
                               Math.cos(a+off)*sp, Math.sin(a+off)*sp);
        clone.armed = true; clone.bounces = 1;
        this.motes.push(clone);
      }
      this.burst(mo.x, mo.y, this.players[mo.owner].char.color, 14);
    }
    if (mo.bounces > mo.maxBounces) this.fizzle(mo);
  }

  fizzle(mo){
    this.burst(mo.x, mo.y, "#8fa3bb", 6);
    this.kill(mo);
  }

  kill(mo){
    if (mo.dead) return;
    mo.dead = true;
    this.players[mo.owner].reloads.push(this.players[mo.owner].st.reload);
  }

  checkDeaths(){
    if (this.result) return;
    const dead = [false,false];

    for (const p of this.players){
      if (!p.alive) continue;
      const b = this.bounds();
      if (p.x < b.x || p.x > b.x+b.w || p.y < b.y || p.y > b.y+b.h) dead[p.idx] = true;

      for (const mo of this.motes){
        if (mo.dead) continue;
        const d = len(mo.x-p.x, mo.y-p.y);
        if (!mo.armed && mo.owner === p.idx) continue;  // your own shot is inert until it arms
        if (d <= p.st.radius + mo.radius){
          if (p.ghost > 0) continue;                    // Silt is letting it through
          dead[p.idx] = true; mo.dead = true;
        } else if (mo.armed && !mo.miss[p.idx] && d <= p.st.radius + mo.radius + 18){
          mo.miss[p.idx] = true; p.addCharge(CHG_MISS); // read it, earn it
        }
      }
    }
    if (!dead[0] && !dead[1]) return;

    for (let i=0;i<2;i++) if (dead[i]){
      this.players[i].alive = false;
      this.burst(this.players[i].x, this.players[i].y, this.players[i].char.color, 46, 260);
    }
    this.shake = 1;
    const winner = dead[0] && dead[1] ? -1 : (dead[0] ? 1 : 0);
    this.result = { winner };
    if (winner >= 0) this.scores[winner]++;
  }

  /* cosmetic only — never touched by anything the outcome depends on */
  burst(x,y,color,n,spd=150){
    for (let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, s = spd*(0.25+Math.random()*0.9);
      this.sparks.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:0.35+Math.random()*0.4,t:0,color});
    }
  }
  stepSparks(dt){
    for (let i=this.sparks.length-1;i>=0;i--){
      const s = this.sparks[i];
      s.t += dt;
      if (s.t >= s.life){ this.sparks.splice(i,1); continue; }
      s.x += s.vx*dt; s.y += s.vy*dt;
      s.vx *= 0.94; s.vy *= 0.94;
    }
  }

  /* ---------- network snapshot (host -> guest) ---------- */
  snapshot(){
    return {
      r:this.round, t:this.time, e:this.encroach, sc:this.scores, pk:this.picks,
      res:this.result ? this.result.winner : null, cd:Math.round(this.countdown*100)/100,
      p:this.players.map(p => [
        Math.round(p.x*10)/10, Math.round(p.y*10)/10,
        Math.round(p.fx*100)/100, Math.round(p.fy*100)/100,
        p.alive?1:0, p.ammo,
        Math.round(p.parryT*100)/100, Math.round(p.dashCd*100)/100,
        Math.round(p.parryCd*100)/100, Math.round(p.flash*100)/100,
        Math.round(p.charge), Math.round(p.ghost*100)/100,
        p.primed?1:0, Math.round(p.burstT*100)/100 ]),
      m:this.motes.map(m => [
        Math.round(m.x*10)/10, Math.round(m.y*10)/10,
        Math.round(m.vx), Math.round(m.vy), m.owner, m.armed?1:0, m.radius ]),
      w:this.temps.map(t => [t.x, t.y, t.w, t.h, t.void?1:0, Math.round(t.ttl*10)/10]),
      g:this.rings.map(r => [r.x, r.y, Math.round(r.t*100)/100, r.life]),
      pu:this.pickups.map(pk => [pk.x, pk.y, Math.round(pk.cd*10)/10]),
      sh:Math.round(this.shake*100)/100,
    };
  }

  applySnapshot(s){
    if (s.pk && (s.pk[0] !== this.players[0].charId || s.pk[1] !== this.players[1].charId)){
      this.setPicks(s.pk);
      this.players.forEach(p => { p.char = CHARS[p.charId]; p.st = p.char.st; });
    }
    if (s.r !== this.round) this.loadRound(s.r);
    this.time = s.t; this.encroach = s.e; this.scores = s.sc;
    this.shake = s.sh; this.countdown = s.cd || 0;
    this.result = s.res === null ? null : { winner:s.res };

    s.p.forEach((a,i) => {
      const p = this.players[i];
      p.x=a[0]; p.y=a[1]; p.fx=a[2]; p.fy=a[3]; p.alive=!!a[4];
      p.ammo=a[5]; p.parryT=a[6]; p.dashCd=a[7]; p.parryCd=a[8]; p.flash=a[9];
      p.charge=a[10]; p.ghost=a[11]; p.primed=!!a[12]; p.burstT=a[13];
    });
    this.temps = s.w.map(t => ({x:t[0], y:t[1], w:t[2], h:t[3], void:!!t[4], ttl:t[5]}));
    this.rings = s.g.map(r => ({x:r[0], y:r[1], t:r[2], life:r[3]}));
    if (s.pu) this.pickups = s.pu.map(pk => ({x:pk[0], y:pk[1], cd:pk[2]}));

    // Rebuild motes, keeping trails for ones that persisted.
    const old = this.motes;
    this.motes = s.m.map((a,i) => {
      const mo = new Mote(this.players[a[4]], a[0], a[1], a[2], a[3]);
      mo.armed = !!a[5]; mo.radius = a[6];
      if (old[i]) mo.trail = old[i].trail;
      mo.trail.push(mo.x, mo.y);
      if (mo.trail.length > 16) mo.trail.splice(0, mo.trail.length - 16);
      return mo;
    });
  }
}

/* ============================================================
   RENDER
   ============================================================ */
function drawRect(r, fill, top){
  ctx.fillStyle = fill;
  ctx.fillRect(r.x, r.y, r.w, r.h);
  if (top){ ctx.fillStyle = top; ctx.fillRect(r.x, r.y, r.w, 2); }
}

function wrapText(text, x, y, maxW, lineH, maxLines){
  const words = text.split(" ");
  let line = "", lines = 0;
  for (const word of words){
    const test = line ? line + " " + word : word;
    if (ctx.measureText(test).width > maxW && line){
      const lastAllowed = lines === maxLines-1;
      ctx.fillText(lastAllowed ? line + "…" : line, x, y + lines*lineH);
      if (++lines >= maxLines) return lines;
      line = word;
    } else line = test;
  }
  if (line){ ctx.fillText(line, x, y + lines*lineH); lines++; }
  return lines;
}

// Auger's dowsing line: where the shot actually goes, two walls ahead.
function predictPath(g, p, maxBounces){
  const pts = [];
  let x = p.x + p.fx*(p.st.radius+2), y = p.y + p.fy*(p.st.radius+2);
  let dx = p.fx, dy = p.fy, bounces = 0, travelled = 0;
  const STEP = 5, r = p.st.moteRadius;
  pts.push(x, y);
  while (bounces <= maxBounces && travelled < 1100){
    x += dx*STEP; y += dy*STEP; travelled += STEP;
    const b = g.bounds();
    let hit = null;
    if (x < b.x + r || x > b.x + b.w - r) hit = "x";
    else if (y < b.y + r || y > b.y + b.h - r) hit = "y";
    if (!hit){
      for (const w of g.obstacles){
        const probe = {x, y};
        const axis = resolveCircleRect(probe, w, r);
        if (axis){ if (w.void) { pts.push(x,y); return pts; } x = probe.x; y = probe.y; hit = axis; break; }
      }
    } else {
      x = clamp(x, b.x + r, b.x + b.w - r);
      y = clamp(y, b.y + r, b.y + b.h - r);
    }
    if (hit){
      pts.push(x, y);
      if (++bounces > maxBounces) break;
      if (hit === "x") dx = -dx; else dy = -dy;
    }
  }
  pts.push(x, y);
  return pts;
}

function render(g, ui){
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  ctx.clearRect(0,0,W,H);
  ctx.save();

  const grd = ctx.createRadialGradient(W/2, H/2, 40, W/2, H/2, W*0.75);
  grd.addColorStop(0, "#132132"); grd.addColorStop(1, "#070b12");
  ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);

  if (g.shake > 0){
    const s = g.shake * 7;
    ctx.translate((Math.random()*2-1)*s, (Math.random()*2-1)*s);
  }

  // tide grid
  ctx.strokeStyle = "rgba(130,180,225,.075)"; ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x=0;x<=W;x+=48){ ctx.moveTo(x+.5,0); ctx.lineTo(x+.5,H); }
  for (let y=0;y<=H;y+=48){ ctx.moveTo(0,y+.5); ctx.lineTo(W,y+.5); }
  ctx.stroke();

  // arena walls
  for (const w of g.walls){
    if (w.void){
      drawRect(w, "#03050a");
      ctx.strokeStyle = "rgba(120,145,180,.7)"; ctx.setLineDash([5,5]);
      ctx.strokeRect(w.x+.5, w.y+.5, w.w-1, w.h-1); ctx.setLineDash([]);
    } else {
      drawRect(w, "#26374b", "rgba(190,225,255,.75)");
      ctx.strokeStyle = "rgba(150,190,230,.22)"; ctx.lineWidth = 1;
      ctx.strokeRect(w.x+.5, w.y+.5, w.w-1, w.h-1);
    }
  }

  // conjured walls: they fade as their time runs out
  for (const t of g.temps){
    const col = g.players[t.owner] ? g.players[t.owner].char.color : "#9fb6cc";
    const a = clamp(t.ttl/1.2, 0.25, 1);
    ctx.globalAlpha = a;
    if (t.void){
      drawRect(t, "#02040a");
      ctx.strokeStyle = col; ctx.lineWidth = 2; ctx.setLineDash([6,6]);
      ctx.strokeRect(t.x+1, t.y+1, t.w-2, t.h-2); ctx.setLineDash([]);
      ctx.globalAlpha = a*0.5;
      ctx.beginPath(); ctx.arc(t.x+t.w/2, t.y+t.h/2, t.w*0.22, 0, 7);
      ctx.strokeStyle = col; ctx.stroke();
    } else {
      drawRect(t, "#3a4a5e", col);
      ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.strokeRect(t.x+1, t.y+1, t.w-2, t.h-2);
    }
    ctx.globalAlpha = 1;
  }

  // ammo pickups
  for (const pk of g.pickups){
    if (pk.cd > 0){
      ctx.globalAlpha = 0.22;
      ctx.strokeStyle = "rgba(200,215,235,.6)"; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(pk.x, pk.y, 9, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
      continue;
    }
    const bob = Math.sin(g.time*3 + pk.x*0.05) * 3;
    ctx.shadowBlur = 14; ctx.shadowColor = "#e9f2ff";
    ctx.fillStyle = "#e9f2ff";
    ctx.save();
    ctx.translate(pk.x, pk.y + bob);
    ctx.rotate(Math.PI/4);
    ctx.fillRect(-6, -6, 12, 12);
    ctx.restore();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,255,255,.5)"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(pk.x, pk.y + bob, 13, 0, 7); ctx.stroke();
  }

  // Keel's ring
  for (const ring of g.rings){
    const k = ring.t / ring.life;
    ctx.globalAlpha = (1-k) * 0.85;
    ctx.strokeStyle = "#e8f4ff"; ctx.lineWidth = 3 + 4*(1-k);
    ctx.beginPath(); ctx.arc(ring.x, ring.y, 210*k, 0, 7); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // the closing dark
  if (g.encroach > 0){
    const e = g.encroach;
    ctx.fillStyle = "rgba(2,3,6,.94)";
    ctx.fillRect(0,0,W,e); ctx.fillRect(0,H-e,W,e);
    ctx.fillRect(0,e,e,H-2*e); ctx.fillRect(W-e,e,e,H-2*e);
    ctx.strokeStyle = "rgba(120,150,190,.5)"; ctx.lineWidth = 1;
    ctx.strokeRect(e+.5, e+.5, W-2*e-1, H-2*e-1);
  }

  ctx.strokeStyle = "rgba(150,190,230,.18)"; ctx.lineWidth = 2;
  ctx.strokeRect(1, 1, W-2, H-2);

  // Auger's dowsing line
  for (const p of g.players){
    if (!p.alive || p.char.id !== "auger") continue;
    const pts = predictPath(g, p, 2);
    ctx.globalAlpha = .32; ctx.strokeStyle = p.char.color;
    ctx.lineWidth = 1.5; ctx.setLineDash([7,9]);
    ctx.beginPath(); ctx.moveTo(pts[0], pts[1]);
    for (let i=2;i<pts.length;i+=2) ctx.lineTo(pts[i], pts[i+1]);
    ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
  }

  // sparks
  for (const s of g.sparks){
    ctx.globalAlpha = 1 - s.t/s.life; ctx.fillStyle = s.color;
    ctx.fillRect(s.x-1.5, s.y-1.5, 3, 3);
  }
  ctx.globalAlpha = 1;

  // motes
  ctx.lineCap = "round";
  for (const m of g.motes){
    const owner = g.players[m.owner].char.color;
    if (m.trail.length >= 4){
      ctx.strokeStyle = owner; ctx.globalAlpha = .28; ctx.lineWidth = m.radius*0.7;
      ctx.beginPath(); ctx.moveTo(m.trail[0], m.trail[1]);
      for (let i=2;i<m.trail.length;i+=2) ctx.lineTo(m.trail[i], m.trail[i+1]);
      ctx.lineTo(m.x, m.y); ctx.stroke(); ctx.globalAlpha = 1;
    }
    ctx.shadowBlur = m.armed ? 22 : 12;
    ctx.shadowColor = owner;
    ctx.fillStyle = m.armed ? "#ffffff" : owner;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.armed ? m.radius : m.radius-1, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    if (!m.armed){
      ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(m.x, m.y, m.radius+3, 0, 7); ctx.stroke();
    }
  }

  // keepers
  for (const p of g.players){
    if (!p.alive) continue;
    const col = p.char.color, rad = p.st.radius;

    if (p.parryT > 0 || p.flash > 0){
      const a = p.parryT > 0 ? 1 : p.flash/0.22;
      ctx.globalAlpha = 0.25 + 0.6*a;
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.st.parryReach, p.facing - p.st.parryArc/2, p.facing + p.st.parryArc/2);
      ctx.stroke(); ctx.globalAlpha = 1;
    }

    if (p.burstT > 0){                      // the moment a special goes off
      const k = p.burstT/0.4;
      ctx.globalAlpha = k*0.8; ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad + 34*(1-k), 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    ctx.globalAlpha = p.ghost > 0 ? 0.32 : 1;    // Silt, mid-duck
    ctx.shadowBlur = 26; ctx.shadowColor = col;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(p.x, p.y, rad, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "#05080d";
    ctx.beginPath(); ctx.arc(p.x, p.y, rad-5, 0, 7); ctx.fill();

    // the mirror: which way the shot and the guard will go
    ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(p.x + p.fx*(rad-1), p.y + p.fy*(rad-1));
    ctx.lineTo(p.x + p.fx*(rad+9), p.y + p.fy*(rad+9));
    ctx.stroke();
    ctx.globalAlpha = 1;

    if (p.primed){                          // Meran's prism is loaded
      ctx.strokeStyle = col; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad+5, 0, 7); ctx.stroke();
    }
    if (p.ready){                           // special is charged
      ctx.globalAlpha = 0.55 + 0.45*Math.sin(g.time*7);
      ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad+9, 0, 7); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    if (p.dashCd > p.st.dashCd - p.st.dashTime - 0.1){
      ctx.globalAlpha = .35; ctx.strokeStyle = col; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(p.x, p.y, rad+6, 0, 7); ctx.stroke(); ctx.globalAlpha = 1;
    }
  }

  ctx.restore();
  drawHUD(g, ui);
}

function bar(x,y,w,h,frac,color){
  ctx.fillStyle = "rgba(255,255,255,.12)"; ctx.fillRect(x,y,w,h);
  ctx.fillStyle = color; ctx.fillRect(x,y,w*clamp(frac,0,1),h);
}

function drawHUD(g, ui){
  ctx.font = "600 12px ui-monospace,SFMono-Regular,Menlo,monospace";
  ctx.textBaseline = "top";

  for (let i=0;i<2;i++){
    const p = g.players[i], col = p.char.color;
    const right = i === 1, x = right ? W-24 : 24;
    ctx.textAlign = right ? "right" : "left";

    ctx.fillStyle = col;
    ctx.fillText(p.char.name, x, 14);
    ctx.fillStyle = CPU.seats[i] ? "rgba(255,255,255,.5)" : "rgba(200,215,235,.38)";
    ctx.font = "500 10px ui-monospace,SFMono-Regular,Menlo,monospace";
    ctx.fillText(CPU.seats[i] ? "CPU · " + CPU_LEVELS[CPU.level].id : p.char.title.toUpperCase(), x, 29);
    ctx.font = "600 12px ui-monospace,SFMono-Regular,Menlo,monospace";

    for (let s=0;s<WINS_NEEDED;s++){          // rounds won
      const px = right ? x - 8 - s*16 : x + 4 + s*16;
      ctx.beginPath(); ctx.arc(px, 50, 5, 0, 7);
      if (s < g.scores[i]){ ctx.fillStyle = col; ctx.fill(); }
      else { ctx.strokeStyle = "rgba(255,255,255,.25)"; ctx.lineWidth = 1; ctx.stroke(); }
    }
    for (let a=0;a<p.st.ammo;a++){            // motes in hand
      const px = right ? x - 6 - a*12 : x + 6 + a*12;
      ctx.beginPath(); ctx.arc(px, 68, 3.2, 0, 7);
      if (a < p.ammo){ ctx.fillStyle = "#e9f2ff"; ctx.fill(); }
      else { ctx.strokeStyle = "rgba(255,255,255,.22)"; ctx.stroke(); }
    }
    const bx = right ? x - 92 : x;
    bar(bx, 80, 92, 3, 1 - p.parryCd/p.st.parryCd, "rgba(255,255,255,.65)");
    bar(bx, 87, 92, 3, 1 - p.dashCd/p.st.dashCd,  col);
    bar(bx, 96, 92, 5, p.charge/CHG_FULL, p.ready ? "#ffffff" : "rgba(255,255,255,.45)");

    ctx.font = "600 9px ui-monospace,SFMono-Regular,Menlo,monospace";
    ctx.fillStyle = p.ready ? "#ffffff" : "rgba(200,215,235,.35)";
    ctx.fillText(p.ready ? p.char.special + " READY" : p.char.special, right ? x : x, 106);
    ctx.font = "600 12px ui-monospace,SFMono-Regular,Menlo,monospace";
  }

  ctx.textAlign = "center";
  ctx.fillStyle = "rgba(210,225,245,.55)";
  ctx.fillText(g.arena.name.toUpperCase(), W/2, 16);

  const left = ROUND_TIME - g.time;
  if (left > 0){
    ctx.fillStyle = left < 10 ? "#ffb347" : "rgba(210,225,245,.4)";
    ctx.fillText("THE DARK IN " + Math.ceil(left), W/2, 34);
  } else {
    ctx.fillStyle = "#ff7a6b";
    ctx.fillText("THE DARK IS CLOSING", W/2, 34);
  }

  if (ui.netLabel){
    ctx.fillStyle = "rgba(160,180,205,.5)";
    ctx.fillText(ui.netLabel, W/2, H-24);
  }

  if (g.countdown > 0){
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.font = "600 34px ui-monospace,SFMono-Regular,Menlo,monospace";
    ctx.fillStyle = "rgba(255,255,255," + (0.5 + 0.5*Math.sin(g.countdown*14)) + ")";
    ctx.fillText(g.countdown > 0.35 ? "READY" : "GO", W/2, H/2);
    ctx.textBaseline = "top";
  }
}

/* ============================================================
   CHARACTER SELECT  (drawn on the canvas so host and guest
   can share one screen over the wire)
   ============================================================ */
const SEL_COLS = 4, CARD_W = 204, CARD_H = 152, CARD_GAP = 16;
const SEL_X = (W - (SEL_COLS*CARD_W + (SEL_COLS-1)*CARD_GAP)) / 2;
const SEL_Y = 132;

function cardRect(i){
  const c = i % SEL_COLS, r = Math.floor(i / SEL_COLS);
  return { x: SEL_X + c*(CARD_W+CARD_GAP), y: SEL_Y + r*(CARD_H+CARD_GAP), w:CARD_W, h:CARD_H };
}

function renderSelect(sel, ui){
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  ctx.clearRect(0,0,W,H);
  const grd = ctx.createRadialGradient(W/2, H/2, 40, W/2, H/2, W*0.8);
  grd.addColorStop(0, "#101c2b"); grd.addColorStop(1, "#05080e");
  ctx.fillStyle = grd; ctx.fillRect(0,0,W,H);

  ctx.textBaseline = "top"; ctx.textAlign = "center";
  ctx.font = "600 11px ui-monospace,SFMono-Regular,Menlo,monospace";
  ctx.fillStyle = "rgba(200,215,235,.45)";
  ctx.fillText("T H E   K E E P E R S   O F   T H E   C O A S T", W/2, 44);
  ctx.font = "500 13px ui-monospace,SFMono-Regular,Menlo,monospace";
  ctx.fillStyle = "rgba(200,215,235,.75)";
  ctx.fillText("Take a fighter.  Fire locks it in, guard takes it back.", W/2, 72);

  ctx.textAlign = "right";
  ctx.font = "600 13px ui-monospace,SFMono-Regular,Menlo,monospace";
  ctx.fillStyle = "#ffd66b";
  ctx.fillText("◆ " + PROGRESS.coins + " salt-coins", W-24, 44);

  for (let i=0;i<CHARS.length;i++){
    const c = CHARS[i], r = cardRect(i);
    const unlocked = isUnlocked(c);
    const chosenBy = [0,1].filter(s => sel.cursor[s] === i);
    const lockedBy = chosenBy.filter(s => sel.locked[s]);

    ctx.fillStyle = lockedBy.length ? "rgba(24,38,54,.95)" : "rgba(16,26,38,.9)";
    ctx.fillRect(r.x, r.y, r.w, r.h);
    ctx.strokeStyle = "rgba(120,155,195,.22)"; ctx.lineWidth = 1;
    ctx.strokeRect(r.x+.5, r.y+.5, r.w-1, r.h-1);

    if (!unlocked){
      ctx.fillStyle = "rgba(4,6,10,.6)";
      ctx.fillRect(r.x, r.y, r.w, r.h);
    }

    // the keeper's own light
    ctx.shadowBlur = 18; ctx.shadowColor = c.color;
    ctx.fillStyle = c.color;
    ctx.globalAlpha = unlocked ? 1 : 0.35;
    ctx.beginPath(); ctx.arc(r.x+28, r.y+30, 11, 0, 7); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = "rgba(16,26,38,1)";
    ctx.beginPath(); ctx.arc(r.x+28, r.y+30, 6, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;

    ctx.textAlign = "left";
    ctx.font = "600 15px ui-monospace,SFMono-Regular,Menlo,monospace";
    ctx.fillStyle = unlocked ? c.color : "rgba(200,215,235,.4)";
    ctx.fillText(c.name, r.x+50, r.y+18);
    ctx.font = "500 10px ui-monospace,SFMono-Regular,Menlo,monospace";
    ctx.fillStyle = "rgba(200,215,235,.5)";
    ctx.fillText(c.title.toUpperCase(), r.x+50, r.y+36);

    if (!unlocked){
      ctx.textAlign = "center";
      ctx.font = "600 22px ui-monospace,SFMono-Regular,Menlo,monospace";
      ctx.fillStyle = "rgba(220,230,245,.55)";
      ctx.fillText("🔒", r.x + r.w/2, r.y + 66);
      ctx.font = "600 12px ui-monospace,SFMono-Regular,Menlo,monospace";
      ctx.fillStyle = "#ffd66b";
      ctx.fillText("◆ " + UNLOCK_COST[c.id], r.x + r.w/2, r.y + 94);
      ctx.font = "500 10px ui-monospace,SFMono-Regular,Menlo,monospace";
      ctx.fillStyle = "rgba(200,215,235,.45)";
      ctx.fillText("fire to unlock", r.x + r.w/2, r.y + 112);
      ctx.textAlign = "left";
    } else {
      ctx.font = "500 10.5px ui-monospace,SFMono-Regular,Menlo,monospace";
      ctx.fillStyle = "rgba(205,220,238,.78)";
      wrapText(c.passive, r.x+14, r.y+58, r.w-28, 13, 3);

      ctx.fillStyle = c.color;
      ctx.font = "600 10px ui-monospace,SFMono-Regular,Menlo,monospace";
      ctx.fillText("◆ " + c.special, r.x+14, r.y+104);
      ctx.fillStyle = "rgba(200,215,235,.58)";
      ctx.font = "500 10px ui-monospace,SFMono-Regular,Menlo,monospace";
      wrapText(c.specialText, r.x+14, r.y+120, r.w-28, 12, 2);
    }

    // seat cursors sit just outside the card, one inset per seat
    chosenBy.forEach(s => {
      const p = g_picksColor(s), inset = s === 0 ? 0 : 4;
      ctx.strokeStyle = p; ctx.lineWidth = 2;
      ctx.globalAlpha = sel.locked[s] ? 1 : 0.55 + 0.45*Math.sin(Date.now()/160);
      ctx.strokeRect(r.x-3+inset, r.y-3+inset, r.w+6-2*inset, r.h+6-2*inset);
      ctx.globalAlpha = 1;
      ctx.fillStyle = p;
      ctx.font = "600 9px ui-monospace,SFMono-Regular,Menlo,monospace";
      ctx.textAlign = s === 0 ? "left" : "right";
      ctx.fillText(sel.locked[s] ? (s===0?"P1 LOCKED":"P2 LOCKED") : (s===0?"P1":"P2"),
                   s === 0 ? r.x : r.x + r.w, r.y + r.h + 8);
    });
  }

  ctx.textAlign = "center";
  ctx.font = "500 11px ui-monospace,SFMono-Regular,Menlo,monospace";
  if (sel.msgT > 0){
    ctx.fillStyle = "#ff8a6b";
    ctx.fillText(sel.msg, W/2, H-42);
  } else {
    ctx.fillStyle = "rgba(200,215,235,.45)";
    ctx.fillText(ui.selHint || "", W/2, H-42);
  }
  ctx.fillStyle = "rgba(200,215,235,.3)";
  ctx.fillText("ESC  —  back to the menu", W/2, H-24);
}

// Seat colours on the select screen: the seat's own pick.
let SELECT_STATE = { cursor:[0,1], locked:[false,false], lastAx:[0,0], lastAy:[0,0], msg:"", msgT:0 };
function g_picksColor(seat){ return CHARS[SELECT_STATE.cursor[seat]].color; }

/* ============================================================
   NETWORK  —  serverless WebRTC. One player hosts and owns the
   simulation; the other sends input and renders what it is told.
   Signalling is done by copy-pasting one code each way, so the
   game needs no backend of any kind.
   ============================================================ */
let netMode = "local";                 // "local" | "host" | "guest"
let pc = null, ch = null, netNote = "";
let localSeq  = { f:0, p:0, d:0, s:0, c:0 };   // guest: presses, as counters
let remoteSeq = { f:0, p:0, d:0, s:0, c:0 };   // host: presses already applied
let remotePkt = { a:[0,0], f:0, p:0, d:0, s:0, c:0 };
let lastUiKey = "";

const enc = o => btoa(String.fromCharCode(...new TextEncoder().encode(JSON.stringify(o)))).replace(/=+$/,"");
const dec = s => JSON.parse(new TextDecoder().decode(
  Uint8Array.from(atob(s.trim().replace(/\s+/g,"")), c => c.charCodeAt(0))));

function newPC(){
  const p = new RTCPeerConnection({ iceServers:[
    { urls:["stun:stun.l.google.com:19302","stun:global.stun.twilio.com:3478"] } ] });
  p.onconnectionstatechange = () => {
    if (p.connectionState === "failed" || p.connectionState === "disconnected"){
      netNote = "connection lost";
      if (state !== ST.MENU) toMenu();
    }
  };
  return p;
}

function iceComplete(p){
  if (p.iceGatheringState === "complete") return Promise.resolve();
  return new Promise(res => {
    const done = () => { p.removeEventListener("icegatheringstatechange", check); res(); };
    const check = () => { if (p.iceGatheringState === "complete") done(); };
    p.addEventListener("icegatheringstatechange", check);
    setTimeout(done, 4000);            // good enough without trickle
  });
}

function wireChannel(){
  ch.binaryType = "arraybuffer";
  ch.onopen = () => {
    netNote = "";
    if (netMode === "host") modeCard(startSelect);
    else show(`<div class="kicker">Connected</div><h2>Waiting for the host</h2>
               <p>Choosing keepers begins in a moment.</p>`);
  };
  ch.onclose = () => { netNote = "the other keeper disconnected"; toMenu(); };
  ch.onmessage = ev => {
    let msg; try { msg = JSON.parse(ev.data); } catch { return; }
    if (netMode === "host" && msg.i){ remotePkt = msg.i; }
    else if (netMode === "guest" && msg.s){ guestApply(msg.s, msg.u); }
  };
}

function netCardShell(title, body, status){
  show(`<div class="kicker">Online duel</div><h2>${title}</h2>${body}
        <p class="hint" id="netstat">${status||""}</p>
        <button class="backBtn" id="netback">‹ BACK  (Esc)</button>`);
  const b = document.getElementById("netback");
  if (b) b.onclick = toMenu;
}
const TA = `style="width:100%;height:110px;background:#0b131c;color:#cfe0f2;border:1px solid #24374b;
  border-radius:6px;padding:10px;font:500 11px/1.45 ui-monospace,monospace;resize:vertical"`;
const BTNS = `style="margin:10px 8px 0 0;background:#132131;color:#e8eef7;border:1px solid #2b3a4d;
  border-radius:6px;padding:9px 16px;font:600 12px/1 ui-monospace,monospace;letter-spacing:.12em;cursor:pointer"`;

function setStat(t){ const el = document.getElementById("netstat"); if (el) el.textContent = t; }

async function hostFlow(){
  netMode = "host"; state = ST.NET;
  netCardShell("Hosting", `<p>Making your invitation code…</p>`, "gathering network routes");
  pc = newPC();
  ch = pc.createDataChannel("duel", { ordered:false, maxRetransmits:0 });
  wireChannel();
  await pc.setLocalDescription(await pc.createOffer());
  await iceComplete(pc);
  if (netMode !== "host") return;
  const code = enc({ t:pc.localDescription.type, s:pc.localDescription.sdp });

  netCardShell("Hosting — you take the left seat", `
    <p><b>1.</b> Send this invitation code to the other keeper:</p>
    <textarea ${TA} id="mine" readonly>${code}</textarea>
    <button ${BTNS} id="copy">COPY CODE</button>
    <p style="margin-top:18px"><b>2.</b> Paste the reply code they send back:</p>
    <textarea ${TA} id="theirs" placeholder="their reply code"></textarea>
    <button ${BTNS} id="go">CONNECT</button>`, "waiting for their reply");

  document.getElementById("copy").onclick = () => {
    const t = document.getElementById("mine"); t.select();
    navigator.clipboard?.writeText(t.value).then(()=>setStat("code copied"), ()=>setStat("select and copy manually"));
  };
  document.getElementById("go").onclick = async () => {
    try {
      const a = dec(document.getElementById("theirs").value);
      await pc.setRemoteDescription({ type:a.t, sdp:a.s });
      setStat("connecting…");
    } catch(e){ setStat("that code could not be read — check it was copied whole"); }
  };
}

async function joinFlow(){
  netMode = "guest"; state = ST.NET;
  netCardShell("Joining — you take the right seat", `
    <p><b>1.</b> Paste the host's invitation code:</p>
    <textarea ${TA} id="theirs" placeholder="their invitation code"></textarea>
    <button ${BTNS} id="go">GENERATE REPLY</button>`, "");

  pc = newPC();
  pc.ondatachannel = ev => { ch = ev.channel; wireChannel(); };

  document.getElementById("go").onclick = async () => {
    let offer;
    try { offer = dec(document.getElementById("theirs").value); }
    catch(e){ return setStat("that code could not be read — check it was copied whole"); }
    setStat("building reply…");
    await pc.setRemoteDescription({ type:offer.t, sdp:offer.s });
    await pc.setLocalDescription(await pc.createAnswer());
    await iceComplete(pc);
    if (netMode !== "guest") return;
    const code = enc({ t:pc.localDescription.type, s:pc.localDescription.sdp });
    netCardShell("Joining — you take the right seat", `
      <p><b>2.</b> Send this reply code back to the host, then wait:</p>
      <textarea ${TA} id="mine" readonly>${code}</textarea>
      <button ${BTNS} id="copy">COPY REPLY</button>`, "waiting for the host to connect");
    document.getElementById("copy").onclick = () => {
      const t = document.getElementById("mine"); t.select();
      navigator.clipboard?.writeText(t.value).then(()=>setStat("reply copied"), ()=>setStat("select and copy manually"));
    };
  };
}

function netTeardown(){
  try { ch && ch.close(); } catch {}
  try { pc && pc.close(); } catch {}
  ch = null; pc = null; netMode = "local";
  localSeq = {f:0,p:0,d:0,s:0,c:0}; remoteSeq = {f:0,p:0,d:0,s:0,c:0};
  remotePkt = { a:[0,0], f:0, p:0, d:0, s:0, c:0 };
}

function send(o){ if (ch && ch.readyState === "open") { try { ch.send(JSON.stringify(o)); } catch {} } }

/* host: turn the guest's packet into one frame of input.
   Presses arrive as counters, so a dropped packet never eats a shot. */
function remoteInput(){
  const i = blankInput();
  i.ax = remotePkt.a[0]; i.ay = remotePkt.a[1];
  for (const k of ["f","p","d","s","c"]){
    if (remotePkt[k] > remoteSeq[k]){
      remoteSeq[k]++;
      if (k==="f") i.fire = true;
      else if (k==="p"){ i.parry = true; i.back = true; }
      else if (k==="d") i.dash = true;
      else if (k==="s") i.special = true;
      else i.confirm = true;
    }
  }
  return i;
}

/* guest: sample the keyboard and bump a counter per press */
function guestSend(){
  const s = currentSchemes()[0];
  let ax = 0, ay = 0;
  if (hasHeld(s.left)) ax -= 1; if (hasHeld(s.right)) ax += 1;
  if (hasHeld(s.up))   ay -= 1; if (hasHeld(s.down))  ay += 1;
  if (hasEdge(s.fire))    localSeq.f++;
  if (hasEdge(s.parry))   localSeq.p++;
  if (hasEdge(s.dash))    localSeq.d++;
  if (hasEdge(s.special)) localSeq.s++;
  if (hasEdge(s.fire) || edge.has("Enter")) localSeq.c++;
  send({ i:{ a:[ax,ay], f:localSeq.f, p:localSeq.p, d:localSeq.d, s:localSeq.s, c:localSeq.c } });
}

function guestApply(s, u){
  const wasAlive = game.players.map(p => p.alive);
  const nMotes = game.motes.length;
  const last = game.motes[nMotes-1];
  const lastPos = last ? {x:last.x, y:last.y} : null;

  game.applySnapshot(s);

  if (game.motes.length < nMotes && lastPos) game.burst(lastPos.x, lastPos.y, "#cfe6ff", 8);
  for (let i=0;i<2;i++) if (wasAlive[i] && !game.players[i].alive)
    game.burst(game.players[i].x, game.players[i].y, game.players[i].char.color, 46, 260);

  if (u.mode) GAME_MODE=u.mode;
   if (u.sel){ SELECT_STATE.cursor = u.sel.c; SELECT_STATE.locked = u.sel.l; }

  const key = JSON.stringify(u);
  if (key !== lastUiKey){
    lastUiKey = key;
    state = u.st;
    if (u.st === ST.CARD) beatCard(u.i, u.r, seatNames());
    else if (u.st === ST.EPI) epilogueCard(u.w, game.scores, seatNames());
    else if (u.st === ST.PLAY || u.st === ST.SELECT) hide();
    else if (u.st === ST.MENU) menuCard();
  }
}

/* ============================================================
   THE CPU
   It plays through exactly the struct a human keyboard fills:
   eight directions, one fire, one guard, one dash, one special.
   Three rules keep it honest —
     · it reads only what is drawn on the screen,
     · it aims in the same eight directions a keyboard can make,
     · it is deterministic, so the same position is answered the
       same way twice and can be learned instead of out-rolled.
   ============================================================ */
const CPU_LEVELS = [
  { id:"APPRENTICE", think:0.30, bounces:0, parryOdds:0.20, dashOdds:0.30,
    specialOdds:0.35, lead:0.0,  hesitate:0.40, keepAt:270, blindFire:0.34 },
  { id:"KEEPER",     think:0.17, bounces:1, parryOdds:0.60, dashOdds:0.70,
    specialOdds:0.80, lead:0.55, hesitate:0.18, keepAt:285, blindFire:0.07 },
  { id:"WARDEN",     think:0.085,bounces:2, parryOdds:0.93, dashOdds:0.95,
    specialOdds:1.00, lead:1.0,  hesitate:0.0,  keepAt:260, blindFire:0.0 },
];

const CPU = { seats:[false,false], level:1, mem:[null,null], selT:0 };

const DIRS8 = (() => {
  const out = [];
  for (let i=0;i<8;i++){ const a = i*Math.PI/4; out.push([Math.cos(a), Math.sin(a)]); }
  return out;
})();

// Deterministic stand-in for a coin flip: the same situation always answers alike.
function hash01(x, y){
  let h = (Math.imul(x|0, 374761393) + Math.imul(y|0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177) | 0;
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// Decorrelates the two seats without favouring either: the draw comes from
// this keeper's own position and the mote in front of it, never from which
// seat it happens to be sitting in.
function cpuDraw(p, a, b){
  return hash01(Math.round(p.x)*13 + (a|0), Math.round(p.y)*7 + (b|0) + CPU.level*101);
}

function cpuMem(){
  return { t:0, round:-1, dir:[0,0], fire:false, dash:false, special:false, parryTarget:0 };
}

function cpuBlocked(g, x, y, r){
  const b = g.bounds();
  if (x < b.x+r || x > b.x+b.w-r || y < b.y+r || y > b.y+b.h-r) return true;
  for (const w of g.obstacles){ if (resolveCircleRect({x,y}, w, r)) return true; }
  return false;
}

function cpuClearLine(g, from, to){
  const dx = to.x-from.x, dy = to.y-from.y, d = len(dx,dy) || 1;
  const stepX = dx/d*12, stepY = dy/d*12;
  let x = from.x, y = from.y;
  for (let i=0;i<d/12;i++){
    x += stepX; y += stepY;
    for (const w of g.obstacles){
      if (x > w.x && x < w.x+w.w && y > w.y && y < w.y+w.h) return false;
    }
  }
  return true;
}

/* Which motes would hit me if I stood perfectly still, and when. */
function cpuThreats(g, p){
  const list = [], step = 1/40, horizon = 1.1;
  for (const mo of g.motes){
    if (!mo.armed && mo.owner === p.idx) continue;       // inert in my own hands
    let x = mo.x, y = mo.y, vx = mo.vx, vy = mo.vy, t = 0;
    const r = mo.radius;
    while (t < horizon){
      x += vx*step; y += vy*step; t += step;
      const b = g.bounds();
      if (x < b.x+r){ x=b.x+r; vx=-vx; } else if (x > b.x+b.w-r){ x=b.x+b.w-r; vx=-vx; }
      if (y < b.y+r){ y=b.y+r; vy=-vy; } else if (y > b.y+b.h-r){ y=b.y+b.h-r; vy=-vy; }
      let eaten = false;
      for (const w of g.obstacles){
        const probe = {x,y}, axis = resolveCircleRect(probe, w, r);
        if (!axis) continue;
        x = probe.x; y = probe.y;
        if (w.void){ eaten = true; break; }
        if (axis === "x") vx = -vx; else vy = -vy;
      }
      if (eaten) break;
      if (len(x-p.x, y-p.y) <= p.st.radius + r + 8){ list.push({ id:mo.id, mote:mo, t, x, y }); break; }
    }
  }
  list.sort((a,b) => a.t - b.t);
  return list;
}

/* Is there a direction that puts a mote into them? Bank shots allowed
   by level. A line that comes back and kills me does not count. */
function cpuFindShot(g, p, foe, lvl){
  const st = p.st, step = 1/40, horizon = 1.5;
  let best = null;
  for (const [dx,dy] of DIRS8){
    const off = st.radius + st.moteRadius + 2, r = st.moteRadius;
    let x = p.x + dx*off, y = p.y + dy*off;
    let vx = dx*st.moteSpeed, vy = dy*st.moteSpeed;
    let t = 0, bounces = 0, hit = null, selfRisk = false;
    while (t < horizon){
      x += vx*step; y += vy*step; t += step;
      const b = g.bounds();
      let wall = false;
      if (x < b.x+r){ x=b.x+r; vx=-vx; wall=true; }
      else if (x > b.x+b.w-r){ x=b.x+b.w-r; vx=-vx; wall=true; }
      if (y < b.y+r){ y=b.y+r; vy=-vy; wall=true; }
      else if (y > b.y+b.h-r){ y=b.y+b.h-r; vy=-vy; wall=true; }
      let eaten = false;
      for (const w of g.obstacles){
        const probe = {x,y}, axis = resolveCircleRect(probe, w, r);
        if (!axis) continue;
        x = probe.x; y = probe.y;
        if (w.void){ eaten = true; break; }
        if (axis === "x") vx = -vx; else vy = -vy;
        wall = true;
      }
      if (eaten) break;
      if (wall && ++bounces > lvl.bounces) break;
      const lt = Math.min(t, 0.5) * lvl.lead;              // lead the target
      const fx = foe.x + foe.vx*lt, fy = foe.y + foe.vy*lt;
      if (len(x-fx, y-fy) <= foe.st.radius + r + 2){ hit = {t, bounces}; break; }
      if (bounces >= 1 && len(x-p.x, y-p.y) <= st.radius + r + 8){ selfRisk = true; break; }
    }
    if (hit && !selfRisk){
      const score = hit.t + hit.bounces*0.3 - (dx*p.fx + dy*p.fy)*0.004;
      if (!best || score < best.score) best = { dir:[dx,dy], score };
    }
  }
  return best;
}

/* Face the incoming mote, but angled as far toward the sender as the
   guard arc allows — a parry returns along your facing. */
function cpuParryFace(p, foe, threat){
  const toMote = Math.atan2(threat.mote.y - p.y, threat.mote.x - p.x);
  const toFoe  = Math.atan2(foe.y - p.y, foe.x - p.x);
  const limit  = p.st.parryArc/2 - 0.10;
  let best = null;
  for (const [dx,dy] of DIRS8){
    const a  = Math.atan2(dy,dx);
    const dm = Math.abs(Math.atan2(Math.sin(a-toMote), Math.cos(a-toMote)));
    if (dm > limit) continue;
    const df = Math.abs(Math.atan2(Math.sin(a-toFoe), Math.cos(a-toFoe)))
             - (dx*p.fx + dy*p.fy)*0.001;
    if (!best || df < best.df) best = { dir:[dx,dy], df };
  }
  if (best) return best.dir;
  const a = Math.round(toMote / (Math.PI/4)) & 7;
  return DIRS8[a];
}

function cpuEscape(g, p, threats){
  let best = null;
  for (const [dx,dy] of DIRS8){
    const px = p.x + dx*p.st.maxSpeed*0.32, py = p.y + dy*p.st.maxSpeed*0.32;
    if (cpuBlocked(g, px, py, p.st.radius)) continue;
    let score = 1e9;
    for (const t of threats) score = Math.min(score, len(px-t.x, py-t.y));
    score += (dx*p.fx + dy*p.fy) * 0.5;
    for (const mo of g.motes){
      if (!mo.armed && mo.owner === p.idx) continue;
      score = Math.min(score, len(px-mo.x, py-mo.y) + 40);
    }
    const b = g.bounds();
    score += Math.min(px-b.x, b.x+b.w-px, py-b.y, b.y+b.h-py) * 0.3;
    if (!best || score > best.score) best = { dir:[dx,dy], score };
  }
  return best ? best.dir : [0,0];
}

function cpuRoam(g, p, foe, threats, lvl){
  const b = g.bounds();
  const circle = Math.atan2(foe.y-p.y, foe.x-p.x)
               + (Math.floor(g.time/1.7) % 2 ? 1 : -1) * Math.PI/2;
  let best = null;
  for (const [dx,dy] of DIRS8){
    const px = p.x + dx*p.st.maxSpeed*0.35, py = p.y + dy*p.st.maxSpeed*0.35;
    if (cpuBlocked(g, px, py, p.st.radius)) continue;
    let score = -Math.abs(len(foe.x-px, foe.y-py) - lvl.keepAt) * 0.02;
    for (const t of threats) score -= Math.max(0, 170 - len(px-t.x, py-t.y)) * 0.04;
    for (const mo of g.motes){
      if (!mo.armed && mo.owner === p.idx) continue;
      score -= Math.max(0, 95 - len(px-mo.x, py-mo.y)) * 0.06;
    }
    score += Math.min(px-b.x, b.x+b.w-px, py-b.y, b.y+b.h-py) * 0.03;
    score += (dx*Math.cos(circle) + dy*Math.sin(circle)) * 1.1;
    score += (dx*p.fx + dy*p.fy) * 0.04;
    if (!best || score > best.score) best = { dir:[dx,dy], score };
  }
  return best ? best.dir : [0,0];
}

/* One rule per keeper — each special is spent where it actually pays. */
function cpuSpecialWanted(g, p, foe, lvl, worst, shot){
  if (!p.ready) return false;
  if (cpuDraw(p, Math.round(g.time*4)*31, 5) > lvl.specialOdds) return false;
  const dFoe = len(foe.x-p.x, foe.y-p.y);
  switch (p.char.id){
    case "ines":  return !!shot || (p.ammo === 0 && dFoe < 430);
    case "cato":  return !!worst && worst.t < 0.30 && p.dashCd > 0;
    case "meran": return !!shot && !p.primed && p.ammo > 0;
    case "odall": return !worst && dFoe < 500 && cpuClearLine(g, foe, p);
    case "silt":  return !!worst && worst.t < 0.22 && p.parryCd > 0;
    case "vane":  return g.motes.some(mo => mo.owner === p.idx && mo.armed &&
                         len(mo.x-foe.x, mo.y-foe.y) < 280 &&
                         (mo.x-foe.x)*mo.vx + (mo.y-foe.y)*mo.vy > 0);
    case "keel":  return !!worst && worst.t < 0.5;
    case "auger": return !!worst && worst.t > 0.25 && worst.t < 0.9;
  }
  return false;
}

function cpuFace(p, target){
  const a = Math.atan2(target.y - p.y, target.x - p.x);
  return DIRS8[(Math.round(a / (Math.PI/4)) & 7)];
}

/* The deliberate part: runs on the level's reaction clock, not every frame. */
function cpuPlan(g, seat, lvl, m){
  const p = g.players[seat], foe = g.players[1-seat];
  m.parryTarget = 0;
  if (!p.alive || !foe.alive || g.result){ m.dir = [0,0]; return; }

  const threats = cpuThreats(g, p);
  const worst = threats[0];
  const shot = (p.fireCd <= 0 && p.ammo > 0) ? cpuFindShot(g, p, foe, lvl) : null;
  const wantSpecial = cpuSpecialWanted(g, p, foe, lvl, worst, shot);

  // Specials that need to be aimed somewhere specific go first.
  if (wantSpecial && (p.char.id === "odall" || p.char.id === "auger")){
    m.special = true;
    m.dir = cpuFace(p, p.char.id === "odall" ? foe : (worst || foe));
    return;
  }
  if (wantSpecial && (p.char.id === "cato" || p.char.id === "silt" || p.char.id === "keel" ||
                      p.char.id === "vane" || p.char.id === "meran")){
    m.special = true;
    if (p.char.id === "meran" && shot) m.dir = shot.dir;
    else m.dir = worst ? cpuEscape(g, p, threats) : m.dir;
    if (p.char.id !== "meran") return;
  }

  // Commit to a parry — the press itself is timed frame by frame below.
  if (worst && worst.t < 0.55 && p.parryCd <= 0 && p.ghost <= 0 &&
      cpuDraw(p, worst.id*17, 11) < lvl.parryOdds){
    m.parryTarget = worst.id;
    m.dir = cpuParryFace(p, foe, worst);
    return;
  }

  // Otherwise get out of the way.
  if (worst && worst.t < 0.42){
    m.dir = cpuEscape(g, p, threats);
    if (p.dashCd <= 0 && worst.t < 0.26 && cpuDraw(p, worst.id*29, 23) < lvl.dashOdds) m.dash = true;
    return;
  }

  // Or take the shot, if there is one and the hands are steady.
  if (shot){
    const jitter = cpuDraw(p, Math.round(g.time*30)*3, 37);
    if (jitter >= lvl.hesitate){
      m.dir = shot.dir;
      if (p.char.id === "ines" && wantSpecial) m.special = true; else m.fire = true;
      return;
    }
  }
  if (p.fireCd <= 0 && p.ammo > 0 && lvl.blindFire > 0 &&
      cpuDraw(p, Math.round(g.time*7)*41, 53) < lvl.blindFire){
    m.dir = cpuFace(p, foe);
    m.fire = true;
    return;
  }
  m.dir = cpuRoam(g, p, foe, threats, lvl);
}

/* Called every frame: holds the plan, and times the guard press itself. */
function cpuInput(g, seat, dt){
  let m = CPU.mem[seat];
  if (!m || m.round !== g.round){ m = CPU.mem[seat] = cpuMem(); m.round = g.round; }
  const lvl = CPU_LEVELS[CPU.level];

  m.t -= dt;
  if (m.t <= 0){ m.t = lvl.think; cpuPlan(g, seat, lvl, m); }

  const i = blankInput();
  i.ax = m.dir[0]; i.ay = m.dir[1];
  i.fire = m.fire; i.dash = m.dash; i.special = m.special;
  m.fire = m.dash = m.special = false;              // an edge lasts one frame

  if (m.parryTarget){
    const p = g.players[seat];
    const mo = g.motes.find(x => x.id === m.parryTarget);
    if (!mo || !p.alive) m.parryTarget = 0;
    else {
      const d = len(mo.x - p.x, mo.y - p.y);
      const closing = d / (len(mo.vx, mo.vy) || 1);
      if (closing <= 0.055 || d <= p.st.parryReach*0.8){ i.parry = true; m.parryTarget = 0; }
    }
  }
  return i;
}

/* The CPU answers your pick on the select screen, then locks its own. */
const CPU_COUNTER = { ines:"keel", cato:"auger", meran:"odall", odall:"silt",
                      silt:"vane", vane:"meran", keel:"cato", auger:"ines" };

function cpuSelectInput(seat){
  const i = blankInput();
  const human = 1 - seat;
  if (!SELECT_STATE.locked[human]) return i;         // let them commit first
  const now = performance.now();
  if (now < CPU.selT) return i;
  CPU.selT = now + 240;                              // a step every 240ms, so it can be watched

  const target = Math.max(0, CHARS.findIndex(c =>
    c.id === CPU_COUNTER[CHARS[SELECT_STATE.cursor[human]].id]));
  const cur = SELECT_STATE.cursor[seat];
  if (cur === target){ i.fire = true; return i; }

  const cc = cur % SEL_COLS, cr = Math.floor(cur / SEL_COLS);
  const tc = target % SEL_COLS, tr = Math.floor(target / SEL_COLS);
  if (cc !== tc) i.ax = Math.sign(tc - cc); else i.ay = Math.sign(tr - cr);
  return i;
}

/* ============================================================
   STATE MACHINE
   ============================================================ */
const ST = { MENU:0, NET:1, SELECT:2, CARD:3, PLAY:4, EPI:5, DIFF:6 };
let state = ST.MENU;
let game = new Game();
let cardIdx = 0, resultLine = "", epiWinner = 0;

function seatNames(){ return game.players.map(p => p.char); }

function uiPacket(){
  return { st:state, mode:GAME_MODE, i:cardIdx, r:resultLine, w:epiWinner,
           sel:{ c:SELECT_STATE.cursor, l:SELECT_STATE.locked } };
}

function toMenu(){
  state = ST.MENU; lastUiKey = "";
  CPU.seats = [false,false]; CPU.mem = [null,null];
  game = new Game();
  netTeardown();
  menuCard();
  if (netNote){ const el = document.querySelector(".kicker"); if (el) el.textContent = netNote; netNote = ""; }
}

function startSelect(){
  SELECT_STATE = { cursor:[0,1], locked:[false,false], lastAx:[0,0], lastAy:[0,0], msg:"", msgT:0 };
  state = ST.SELECT;
  hide();
}

function stepSelect(inputs){
  for (let s=0;s<2;s++){
    const inp = inputs[s];
    if (SELECT_STATE.locked[s]){
      if (inp.back) SELECT_STATE.locked[s] = false;     // guard takes your pick back
      continue;
    }
    // move one card per press, not one per frame
    const ax = Math.sign(inp.ax), ay = Math.sign(inp.ay);
    let i = SELECT_STATE.cursor[s];
    if (ax !== 0 && ax !== SELECT_STATE.lastAx[s]){
      const col = i % SEL_COLS, row = Math.floor(i / SEL_COLS);
      i = row*SEL_COLS + (col + ax + SEL_COLS) % SEL_COLS;
    }
    if (ay !== 0 && ay !== SELECT_STATE.lastAy[s]){
      const rows = Math.ceil(CHARS.length / SEL_COLS);
      const col = i % SEL_COLS, row = Math.floor(i / SEL_COLS);
      i = ((row + ay + rows) % rows)*SEL_COLS + col;
    }
    SELECT_STATE.cursor[s] = clamp(i, 0, CHARS.length-1);
    SELECT_STATE.lastAx[s] = ax; SELECT_STATE.lastAy[s] = ay;
    if (inp.fire){
      const c = CHARS[SELECT_STATE.cursor[s]];
      if (CPU.seats[s] || isUnlocked(c)) SELECT_STATE.locked[s] = true;
      else if (tryUnlock(c)) SELECT_STATE.locked[s] = true;
      else { SELECT_STATE.msg = "Need " + (UNLOCK_COST[c.id]-PROGRESS.coins) + " more salt-coins for " + c.name; SELECT_STATE.msgT = 2.2; }
    }
  }
  if (SELECT_STATE.msgT > 0) SELECT_STATE.msgT -= 1/60;
  if (SELECT_STATE.locked[0] && SELECT_STATE.locked[1]) beginMatch();
}

function beginMatch(){
  game = new Game(SELECT_STATE.cursor.slice());
  cardIdx = 0; resultLine = "";
  state = ST.CARD;
  beatCard(0, "", seatNames());
}

function beginRound(){
  game.loadRound(cardIdx);
  state = ST.PLAY;
  hide();
}

function endOfRound(){
  const w = game.result.winner;
  if (w === -1){                                   // both lamps out: nobody profits
    resultLine = "Simultaneous — the round is void";
    beginRound();
    return;
  }
  if (game.scores[w] >= (GAME_MODE==="sudden" ? 1 : WINS_NEEDED)){
    epiWinner = w; state = ST.EPI;
    LAST_COINS_EARNED = 0;
    // Coins are earned only by a human beating the CPU — never for CPU vs CPU,
    // never for local or online duels between two people.
    if (CPU.seats[0] !== CPU.seats[1] && !CPU.seats[w]){
      LAST_COINS_EARNED = CPU_WIN_COINS[CPU.level];
      PROGRESS.coins += LAST_COINS_EARNED;
      saveProgress();
    }
    epilogueCard(w, game.scores, seatNames());
    return;
  }
  cardIdx++;
  resultLine = `${game.players[w].char.name} takes the round, ` +
               `${ROUND_FLAVOR[Math.min(cardIdx-1, ROUND_FLAVOR.length-1)]}` +
               ` — ${game.scores[0]}–${game.scores[1]}`;
  state = ST.CARD;
  beatCard(cardIdx, resultLine, seatNames());
}

/* ============================================================
   MAIN LOOP
   ============================================================ */
const FIXED = 1/120;
let acc = 0, last = performance.now();

function tick(now){
  requestAnimationFrame(tick);
  const dt = Math.min(0.1, (now - last)/1000); last = now;

  if (edge.has("Escape") && state !== ST.MENU){ netNote = ""; toMenu(); edge.clear(); return; }

  if (netMode === "guest"){
    guestSend();
    game.stepSparks(dt);
    if (state === ST.PLAY) render(game, { netLabel:"ONLINE — you hold the right seat" });
    else if (state === ST.SELECT) renderSelect(SELECT_STATE, { selHint:"the host takes the left seat" });
    edge.clear();
    return;
  }

  const seatInputs = () => {
    if (netMode === "host") return [readInput(0), remoteInput()];
    return [0,1].map(s => CPU.seats[s] ? cpuInput(game, s, dt) : readInput(s));
  };

  switch (state){
    case ST.MENU:
      if (edge.has("Digit1") || edge.has("Numpad1")){ netMode = "local"; CPU.seats = [false,false]; startSelect(); }
      else if (edge.has("Digit2") || edge.has("Numpad2")) hostFlow();
      else if (edge.has("Digit3") || edge.has("Numpad3")) joinFlow();
      else if (edge.has("Digit4") || edge.has("Numpad4")){ state = ST.DIFF; difficultyCard(); }
      else if (edge.has("Digit5") || edge.has("Numpad5")) modeCard();
      else if (edge.has("Digit6") || edge.has("Numpad6")) shopCard();
      else if (edge.has("Digit7") || edge.has("Numpad7")) settingsCard();
      break;

    case ST.DIFF: {
      const pick = ["Digit1","Digit2","Digit3"].findIndex(k => edge.has(k));
      if (pick >= 0){ netMode = "local"; CPU.level = pick; CPU.seats = [false,true]; startSelect(); }
      break;
    }

    case ST.NET:
      break;

    case ST.SELECT: {
      stepSelect([0,1].map(s =>
        CPU.seats[s] ? cpuSelectInput(s)
        : (netMode === "host" && s === 1) ? remoteInput() : readInput(s)));
      if (state === ST.SELECT)
        renderSelect(SELECT_STATE, { selHint: netMode === "host"
          ? "you hold the left seat — they choose for themselves"
          : CPU.seats[1] ? "take your mirror — the tower answers with its own"
          : "player one on W A S D, player two on the arrows" });
      break;
    }

    case ST.CARD: {
      const go = netMode === "host" ? (anyConfirm() || remoteInput().confirm) : anyConfirm();
      if (go) beginRound();
      break;
    }

    case ST.PLAY: {
      const inputs = seatInputs();
      acc += dt;
      let first = true;
      while (acc >= FIXED){
        game.step(FIXED, inputs);
        acc -= FIXED;
        if (first){                       // a press fires once, not once per substep
          for (const i of inputs){ i.fire = i.parry = i.dash = i.special = false; }
          first = false;
        }
      }
      render(game, { netLabel: netMode === "host" ? "ONLINE — you hold the left seat" : "" });
      if (game.result && game.overTimer > 1.8) endOfRound();
      break;
    }

    case ST.EPI:
      if (netMode === "host" ? (anyConfirm() || remoteInput().confirm) : anyConfirm()) startSelect();
      break;
  }

  if (netMode === "host") send({ s:game.snapshot(), u:uiPacket() });
  edge.clear();
}

menuCard();
requestAnimationFrame(tick);
</script>
